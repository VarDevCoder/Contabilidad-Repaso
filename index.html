rgin:0;color:#b2bed2;line-height:1.77}.source{color:#8798b4;font-size:11px}.question{font-size:clamp(20px,2.3vw,28px);line-height:1.35;letter-spacing:-.5px;margin:15px 0 23px}.answer{width:100%;text-align:left;border:1px solid #303a50;border-radius:12px;background:#161e2d;color:#dfe7f8;padding:15px;display:flex;gap:13px;align-items:center;margin:9px 0;transition:.15s}.answer:hover:not(:disabled){border-color:#7771b4;background:#1c2540}.answer.selected{border-color:#9b8dff;background:#242244}.answer.correct{background:#15382f;border-color:#38b997}.answer.wrong{background:#3b202c;border-color:#d46c80}.letter{display:inline-grid;place-items:center;flex:none;width:29px;height:29px;border-radius:8px;background:#303a50;font-size:12px;font-weight:800}.feedback{padding:15px;border-radius:12px;background:#142e2d;border:1px solid #285c51;margin-top:15px}.feedback.bad{background:#36222b;border-color:#70424f}.feedback p{margin:5px 0 0;color:#c7d4dc}.footer-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:22px}.select{border:1px solid var(--line);background:#192235;color:var(--text);border-radius:10px;padding:11px 13px;min-width:170px}.face{min-height:250px;border-radius:15px;border:1px solid #4d4b7c;background:radial-gradient(circle at 90% 15%,#493a8f70,transparent 46%),linear-gradient(145deg,#242345,#171c32);width:100%;color:white;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;cursor:pointer}.face:hover{border-color:#a29af9}.face h2{font-size:clamp(23px,3vw,32px);margin:8px 0}.face p{font-size:15px;max-width:510px;color:#d0d5ed}.empty{text-align:center;padding:45px 20px;color:var(--muted)}.results{font-size:52px;font-weight:900;line-height:1.1;letter-spacing:-3px}.search{width:100%;padding:11px 15px;border:1px solid var(--line);border-radius:10px;background:#151d2c;color:var(--text)}.listrow{padding:14px 0;border-bottom:1px solid var(--line)}.listrow:las <script>
const TOPICS=[{"id":"empresa","name":"La empresa","short":"Origen, evolución y concepto","accent":"#7c83ff","source":"La Empresa.docx","sections":[["Concepto y propósito","Una empresa es una organización dedicada a producir bienes o prestar servicios demandados por consumidores. Busca satisfacer necesidades y, según el material, obtener un beneficio económico. Para funcionar necesita misión, objetivos, estrategia, políticas y planificación."],["Evolución histórica","Primitiva: caza, pesca y recolección con división del trabajo por edad y sexo. Grandes civilizaciones: control del trabajo y organización de recursos, como en Egipto. Grecolatina: esclavismo y supervisión. Edad Media: feudalismo, talleres artesanales y gremios. Edad Moderna: trabajo asalariado y capitalismo comercial. Revolución Industrial: mecanización, grandes fábricas y producción en serie. Siglo XX: consolidación de la administración. Siglo XXI: globalización, automatización, calidad y orientación al cliente."],["Qué recordar","Los talleres medievales son antecedentes de la empresa y los gremios de sindicatos actuales. La Revolución Industrial expandió las fábricas y transformó los procesos productivos. Una empresa puede adoptar distintas formas jurídicas y desarrollar una actividad económica."]]},{"id":"admin","name":"Administración","short":"Conceptos y características","accent":"#b18cff","source":"Origen y desarrollo de la administración (PDF)","sections":[["Definiciones de autores","Para Henri Fayol, administrar implica prever, organizar, dirigir, coordinar y controlar. José Antonio Fernández Arena pone el foco en objetivos institucionales mediante esfuerzo humano coordinado. Agustín Reyes Ponce la vincula con la máxima eficiencia en la estructura y manejo de un organismo social. George R. Terry habla de planeación, organización, ejecución y control."],["Cuatro características","Universalidad: existe donde hay organismos sociales. Especificidad: se distingue de fenómenos contables, productivos o jurídicos. Unidad temporal: sus fases coexisten en la práctica. Unidad jerárquica: distintos niveles de jefatura forman un mismo cuerpo administrativo."],["Por qué importa","Coordina recursos humanos y materiales, eleva productividad y contribuye a la eficacia. En grandes organizaciones es indispensable por su complejidad; en pequeñas y medianas puede mejorar su capacidad de competir. La administración pública se enfoca en organismos de orden público y la privada en los de tipo privado."]]},{"id":"formalizacion","name":"Formalización","short":"Economía formal y OIT","accent":"#46c8ae","source":"La formalización de las empresas, OIT (PDF)","sections":[["Definición","La formalización consiste en la incorporación gradual de empresas a la economía formal. Incluye registro y licencias, seguridad social y cumplimiento de normas tributarias y laborales. No necesariamente ocurre todo de una sola vez."],["Objetivos y beneficios","La OIT promueve crear más y mejores empleos, reducir pobreza y vulnerabilidad y mejorar condiciones de trabajo. Para una empresa, formalizarse puede facilitar financiación, acceso a mercados y licitaciones, y reducir la exposición a sanciones. Para la sociedad, puede ampliar ingresos fiscales y favorecer la competencia leal."],["Medidas e intervención","Simplificar trámites y costos, ofrecer incentivos y acceso a servicios, mejorar productividad y capacitación, promover diálogo y cumplimiento legal. El documento menciona la Recomendación núm. 204 de la OIT y la meta ODS 8.3."]]},{"id":"contabilidad","name":"Contabilidad y gestión","short":"Información para decidir","accent":"#f0bd67","source":"Tarea Nº 1 — Importancia de la Contabilidad.docx","sections":[["Papel de la contabilidad","Registra, clasifica y resume sistemáticamente las operaciones económicas para producir información confiable, oportuna y verificable de la situación patrimonial y los resultados de la empresa."],["Para qué sirve","La contabilidad es una herramienta de gestión que permite tomar decisiones fundamentadas, y no solo cumplir obligaciones tributarias. Sus informes son relevantes para directivos, inversionistas, proveedores y entidades públicas."],["Responsabilidad del profesional","Debe proteger la calidad, transparencia y exactitud de los datos. El documento destaca responsabilidad ética y técnica, rigor, orden y vocabulario contable adecuado."]]},{"id":"software","name":"Software contable","short":"Funciones, tipos y beneficios","accent":"#5fb4ef","source":"EL SOFTWARE CONTABLE.docx","sections":[["Qué es y qué hace","Es un programa computarizado que centraliza la información financiera y registra operaciones como compras, ventas, inventarios y cuentas por cobrar. Puede generar informes, balances y estados financieros, realizar seguimiento diario y brindar datos oportunos."],["Ventajas y límites","Reduce papeleo, tiempos y errores; mejora el acceso a información para decidir. Requiere inversión, selección adecuada, capacitación, soporte y actualización. No reemplaza la supervisión del profesional contable."],["Características esenciales","Fácil manejo, actualización y soporte técnico, informes, flexibilidad, capacidad de almacenamiento, seguridad por permisos y unificación de procesos."],["Tipos mencionados","Hojas de cálculo, software personalizado, comercial, ERP, gratuito y en línea. El ERP integra departamentos; el online permite acceso mediante internet; una hoja de cálculo básica puede carecer de integración y controles contables."]]}];
const QUESTIONS=[{"id":"q01","topic":"empresa","q":"Según el material, ¿qué hace principalmente una empresa?","options":["Administra únicamente recursos del Estado","Produce bienes o presta servicios para atender necesidades","Se dedica exclusivamente a tributar","Reemplaza a los consumidores"],"answer":1,"why":"La empresa desarrolla actividad económica mediante bienes o servicios que responden a demandas.","source":"La Empresa · Introducción"},{"id":"q02","topic":"empresa","q":"¿Qué elemento se considera necesario para orientar una empresa?","options":["Misión y objetivos claros","Ausencia de estrategia","Exclusión de normas","Solo un logotipo"],"answer":0,"why":"El material destaca misión, objetivos, estrategia y planificación.","source":"La Empresa · Introducción"},{"id":"q03","topic":"empresa","q":"¿Qué actividades predominaron en la época primitiva?","options":["Banca digital y exportaciones","Caza, pesca y recolección","Producción fabril en serie","Comercio electrónico"],"answer":1,"why":"Los grupos se organizaban para subsistir mediante esas actividades.","source":"La Empresa · Época Primitiva"},{"id":"q04","topic":"empresa","q":"¿Cómo se dividía inicialmente el trabajo según el material?","options":["Por acciones bursátiles","Por edad y sexo","Por nacionalidad de las empresas","Por licencia de software"],"answer":1,"why":"El texto describe división del trabajo por edad y sexo.","source":"La Empresa · Época Primitiva"},{"id":"q05","topic":"empresa","q":"¿Qué ejemplo ilustra la administración en las grandes civilizaciones?","options":["Las pirámides de Egipto","Las aplicaciones móviles","Las redes sociales","Los microprocesadores"],"answer":0,"why":"Construcciones como las pirámides exigían coordinación y supervisión del trabajo.","source":"La Empresa · Grandes Civilizaciones"},{"id":"q06","topic":"empresa","q":"¿Qué caracterizó a la administración de la Antigüedad Grecolatina según el material?","options":["Automatización","Cooperativismo digital","Esclavismo y estricta supervisión","Oficinas virtuales"],"answer":2,"why":"El documento describe un modelo coercitivo sustentado en esclavismo.","source":"La Empresa · Antigüedad Grecolatina"},{"id":"q07","topic":"empresa","q":"¿Qué organización aparece vinculada a la Edad Media?","options":["Talleres artesanales y gremios","Corporaciones multinacionales digitales","Startups de IA","Fábricas automatizadas"],"answer":0,"why":"Los maestros, oficiales y aprendices trabajaban en talleres; surgieron gremios.","source":"La Empresa · Edad Media"},{"id":"q08","topic":"empresa","q":"¿A qué organizaciones actuales se consideran antecedentes los gremios medievales?","options":["Bancos centrales","Sindicatos","Plataformas de streaming","Laboratorios"],"answer":1,"why":"El texto identifica a los gremios como antecedentes de los sindicatos.","source":"La Empresa · Edad Media"},{"id":"q09","topic":"empresa","q":"¿Qué cambio acompañó a la Edad Moderna según el documento?","options":["Desaparición total del comercio","Capitalismo comercial y trabajo asalariado","Invención de la nube","Fin de la administración"],"answer":1,"why":"Se describe la contratación de campesinos asalariados y el aumento del comercio.","source":"La Empresa · Edad Moderna"},{"id":"q10","topic":"empresa","q":"¿Cuál fue una consecuencia de la Revolución Industrial?","options":["El fin de toda fábrica","La sustitución de todas las empresas por gremios","Mecanización y producción en serie","La desaparición de las ciudades"],"answer":2,"why":"La mecanización permitió expandir grandes fábricas y producción en serie.","source":"La Empresa · Revolución Industrial"},{"id":"q11","topic":"empresa","q":"En el siglo XX, la administración se consolidó como...","options":["Una actividad innecesaria","Una disciplina para lograr mayor eficiencia","Un tipo de impuesto","Un sistema de trueque"],"answer":1,"why":"El avance industrial hizo esencial coordinar organizaciones complejas.","source":"La Empresa · Siglo XX"},{"id":"q12","topic":"empresa","q":"¿Qué rasgo destaca en las empresas del siglo XXI?","options":["Aislamiento total de mercados","Retorno exclusivo al feudalismo","Globalización, automatización y competitividad","Eliminación de los clientes"],"answer":2,"why":"El texto vincula el siglo XXI con globalización, tecnología y orientación al cliente.","source":"La Empresa · Siglo XXI"},{"id":"q13","topic":"admin","q":"¿A qué autor se atribuye prever, organizar, dirigir, coordinar y controlar?","options":["George R. Terry","Henri Fayol","Agustín Reyes Ponce","James Watt"],"answer":1,"why":"Es la formulación de administrar de Henri Fayol.","source":"Origen y desarrollo · Conceptos"},{"id":"q14","topic":"admin","q":"¿Cuál de estas definiciones corresponde a José Antonio Fernández Arena?","options":["Una ciencia social orientada a objetivos institucionales mediante esfuerzo humano coordinado","Un simple registro de facturas","Un programa para ventas","Una organización sin objetivos"],"answer":0,"why":"El autor enfatiza una estructura y el esfuerzo humano coordinado.","source":"Origen y desarrollo · Conceptos"},{"id":"q15","topic":"admin","q":"¿Quién relaciona la administración con la máxima eficiencia de un organismo social?","options":["Agustín Reyes Ponce","James Watt","Henri Ford","Adam Smith"],"answer":0,"why":"Reyes Ponce la describe como conjunto sistemático de reglas para lograr máxima eficiencia.","source":"Origen y desarrollo · Conceptos"},{"id":"q16","topic":"admin","q":"¿Qué secuencia se menciona en la definición de George R. Terry?","options":["Registro, facturación, archivo, venta","Planeación, organización, ejecución y control","Comprar, vender, publicar y cerrar","Cazar, pescar y recolectar"],"answer":1,"why":"Terry la presenta como un proceso distintivo con esas cuatro actividades.","source":"Origen y desarrollo · Conceptos"},{"id":"q17","topic":"admin","q":"¿Qué significa universalidad de la administración?","options":["Solo existe en empresas grandes","Está presente donde existe un organismo social","Solo se aplica a contadores","Es específica de un país"],"answer":1,"why":"Puede encontrarse en Estado, empresas, ejército y otras organizaciones.","source":"Origen y desarrollo · Características"},{"id":"q18","topic":"admin","q":"¿A qué se refiere la especificidad administrativa?","options":["Es idéntica a la contabilidad","Siempre opera sin personas","Es distinta de fenómenos técnicos, jurídicos y contables","Solo se estudia en universidades"],"answer":2,"why":"La función administrativa conserva identidad propia aunque conviva con otras funciones.","source":"Origen y desarrollo · Características"},{"id":"q19","topic":"admin","q":"¿Qué expresa la unidad temporal?","options":["Que planear impide controlar","Que las fases administrativas pueden coexistir","Que solo se administra una hora al día","Que las etapas nunca se relacionan"],"answer":1,"why":"Planear, organizar, dirigir y controlar pueden darse simultáneamente.","source":"Origen y desarrollo · Características"},{"id":"q20","topic":"admin","q":"¿Qué significa unidad jerárquica?","options":["Solo manda el propietario","Los niveles de autoridad participan en un mismo cuerpo administrativo","No existen supervisores","Todos tienen exactamente las mismas atribuciones"],"answer":1,"why":"Jefaturas de distintos niveles participan en una misma administración.","source":"Origen y desarrollo · Características"},{"id":"q21","topic":"admin","q":"¿Por qué es importante administrar bien en una pyme?","options":["Para evitar toda competencia","Para coordinar recursos y mejorar competitividad","Para eliminar el personal","Para prescindir de objetivos"],"answer":1,"why":"El material señala la mejora administrativa como vía para competir con organizaciones mayores.","source":"Origen y desarrollo · Importancia"},{"id":"q22","topic":"admin","q":"¿Cuál es un resultado de una administración adecuada?","options":["Reducción inevitable de productividad","Mejora de productividad","Desaparición del mercado","Ausencia de coordinación"],"answer":1,"why":"La buena administración ayuda a coordinar recursos y elevar la productividad.","source":"Origen y desarrollo · Importancia"},{"id":"q23","topic":"admin","q":"¿Cuál es la diferencia planteada entre administración pública y privada?","options":["El idioma usado","La pública busca eficiencia en organismos de orden público; la privada en organismos privados","La pública no organiza nada","La privada no puede controlar"],"answer":1,"why":"La distinción del artículo depende del tipo de organismo social.","source":"Origen y desarrollo · Pública y privada"},{"id":"q24","topic":"admin","q":"¿Cuándo surge la administración, según el artículo?","options":["Solo con las computadoras","Cuando las personas comienzan a trabajar organizadamente en sociedad","Al inventarse la web","Solo después de 2000"],"answer":1,"why":"El artículo sitúa sus antecedentes en la cooperación y organización humana.","source":"Origen y desarrollo · Administración general"},{"id":"q25","topic":"formalizacion","q":"¿Qué es formalizar una empresa según la OIT?","options":["Trasladarla de ciudad","Incorporarla a la economía formal","Cerrar sus operaciones","Cambiar únicamente el logo"],"answer":1,"why":"La definición de la OIT es la incorporación a la economía formal.","source":"OIT · p. 1"},{"id":"q26","topic":"formalizacion","q":"¿Cuál es una dimensión de la formalización?","options":["Registro y licencias ante autoridades","Eliminar registros tributarios","Ocultar empleados","Evitar las leyes laborales"],"answer":0,"why":"Incluye registro, licencias, seguridad social y cumplimiento legal.","source":"OIT · p. 1"},{"id":"q27","topic":"formalizacion","q":"La formalización de una empresa es un proceso...","options":["Siempre instantáneo","Gradual","Prohibido para pymes","Exclusivamente tecnológico"],"answer":1,"why":"Una empresa puede formalizar aspectos en distintos momentos.","source":"OIT · p. 1"},{"id":"q28","topic":"formalizacion","q":"¿Qué objetivo destaca la OIT al promover formalización?","options":["Crear más y mejores empleos","Evitar los aportes de seguridad social","Eliminar controles","Reducir la productividad"],"answer":0,"why":"Se busca más trabajo decente, menos pobreza y vulnerabilidad.","source":"OIT · p. 1"},{"id":"q29","topic":"formalizacion","q":"¿Qué beneficio puede ofrecer la formalización a una empresa?","options":["Acceder a financiación y mercados","Quedar exenta de toda norma","Garantizar ganancias ilimitadas","Nunca pagar impuestos"],"answer":0,"why":"El material menciona financiación, mercados, licitaciones y menor exposición a sanciones.","source":"OIT · p. 1"},{"id":"q30","topic":"formalizacion","q":"¿Qué efecto social se asocia con empresas formalizadas?","options":["Menor disponibilidad de servicios públicos por definición","Mayores ingresos fiscales para servicios públicos","Supresión del empleo","Imposibilidad de competir"],"answer":1,"why":"La formalización puede ampliar ingresos fiscales que financian bienes y servicios públicos.","source":"OIT · p. 1"},{"id":"q31","topic":"formalizacion","q":"¿Cuál de estas medidas favorece la formalización según la OIT?","options":["Trámites registrales más complejos","Reducir obstáculos al registro y cumplimiento","Suspender toda capacitación","Limitar acceso a mercados"],"answer":1,"why":"La OIT recomienda facilitar trámites y reducir obstáculos de entrada.","source":"OIT · p. 2"},{"id":"q32","topic":"formalizacion","q":"¿Qué recomendación de la OIT se menciona sobre transición a la economía formal?","options":["Recomendación 204","Recomendación 10","Recomendación 500","Recomendación 1"],"answer":0,"why":"El documento cita expresamente la Recomendación núm. 204.","source":"OIT · p. 2"},{"id":"q33","topic":"formalizacion","q":"En el modelo de intervención de la OIT, ¿qué aparece como resultado final?","options":["Más empleo de calidad y menor vulnerabilidad","Más papeleo necesariamente","Desaparición de los mercados","Menos cohesión social"],"answer":0,"why":"El esquema plantea mejora del empleo, reducción de vulnerabilidad y cohesión social.","source":"OIT · p. 2, diagrama"},{"id":"q34","topic":"formalizacion","q":"La formalización también busca reducir...","options":["La seguridad jurídica","La competencia desleal de empresas informales","La información empresarial","La cobertura social"],"answer":1,"why":"La OIT indica que reduce competencia desleal para empresas que cumplen sus obligaciones.","source":"OIT · p. 1"},{"id":"q35","topic":"contabilidad","q":"¿Qué operaciones realiza la contabilidad según la tarea?","options":["Registra, clasifica y resume operaciones económicas","Solo diseña campañas publicitarias","Únicamente recluta empleados","Borra la información financiera"],"answer":0,"why":"La tarea define estas funciones para producir información fiable.","source":"Tarea Nº 1 · Párrafo 1"},{"id":"q36","topic":"contabilidad","q":"¿Qué información aporta la contabilidad?","options":["Solo inventario de muebles","Situación patrimonial y resultados de la empresa","El color del logotipo","Únicamente horarios"],"answer":1,"why":"Informa sobre patrimonio y resultados para apoyar decisiones.","source":"Tarea Nº 1 · Párrafo 1"},{"id":"q37","topic":"contabilidad","q":"¿Para qué sirve la contabilidad además de cumplir obligaciones fiscales?","options":["Solo aumentar archivos físicos","Apoyar la toma de decisiones empresariales","Eliminar toda auditoría","Impedir el análisis"],"answer":1,"why":"La tarea recalca que es una herramienta de gestión, no solo tributaria.","source":"Tarea Nº 1 · Párrafos 2–3"},{"id":"q38","topic":"contabilidad","q":"¿Qué cualidades debe tener la información contable?","options":["Ambigua y tardía","Confiable, oportuna y verificable","Secreta para toda la empresa","Solo aproximada"],"answer":1,"why":"La tarea emplea esas tres cualidades de la información contable.","source":"Tarea Nº 1 · Párrafo 1"},{"id":"q39","topic":"contabilidad","q":"¿Quiénes pueden usar la información contable?","options":["Solo empleados del área de limpieza","Directivos, inversionistas y entidades públicas, entre otros","Exclusivamente desarrolladores","Nadie fuera del banco"],"answer":1,"why":"Diferentes interesados necesitan información para decidir.","source":"Tarea Nº 1 · Párrafo 2"},{"id":"q40","topic":"contabilidad","q":"¿Qué responsabilidad destaca en el profesional contable?","options":["Rigor ético y técnico","Ocultar errores sin registro","Evitar supervisión","Garantizar utilidades"],"answer":0,"why":"La calidad de los datos afecta la confianza de interesados.","source":"Tarea Nº 1 · Párrafo 2"},{"id":"q41","topic":"contabilidad","q":"En el trabajo, ¿cómo se caracteriza a la empresa?","options":["Unidad económico-social con recursos humanos, materiales, técnicos y financieros","Un tipo de computadora","Un edificio exclusivamente","Una entidad sin personas"],"answer":0,"why":"El primer párrafo describe los recursos y el propósito económico-social.","source":"Tarea Nº 1 · Párrafo 1"},{"id":"q42","topic":"contabilidad","q":"¿Qué impulsa la competencia según la tarea?","options":["La mejora continua en calidad, precio y servicio","La suspensión total de actividad","La desaparición de clientes","La obligación de usar un software"],"answer":0,"why":"La competencia puede estimular mejores productos y servicios.","source":"Tarea Nº 1 · Párrafo 1"},{"id":"q43","topic":"contabilidad","q":"¿Qué visión del aprendizaje expresa la tarea?","options":["La contabilidad solo existe por impuestos","La contabilidad es un lenguaje de los negocios para gestionar con transparencia","Los datos financieros no importan","La gestión debe evitar números"],"answer":1,"why":"El cierre la presenta como herramienta de gestión y lenguaje empresarial.","source":"Tarea Nº 1 · Párrafo 3"},{"id":"q44","topic":"software","q":"¿Qué es un software contable?","options":["Un juego comercial","Un programa que integra información financiera y facilita operaciones contables","Una red social","Una impresora"],"answer":1,"why":"El documento lo define como programa computarizado con datos financieros integrados.","source":"Software contable · Definición"},{"id":"q45","topic":"software","q":"¿Qué operaciones puede registrar un software contable?","options":["Ventas, compras, inventarios y cuentas por cobrar","Solo fotografías de productos","Únicamente llamadas","Solo correo electrónico"],"answer":0,"why":"Esas operaciones aparecen entre sus principales datos.","source":"Software contable · Definición"},{"id":"q46","topic":"software","q":"¿Cuál es un objetivo del software contable?","options":["Aumentar el trabajo duplicado","Centralizar información y ofrecer datos oportunos","Evitar todo informe","Eliminar toda contabilidad"],"answer":1,"why":"Los objetivos listan seguimiento diario, procesos ágiles, centralización e información oportuna.","source":"Software contable · Objetivos"},{"id":"q47","topic":"software","q":"¿Qué ventaja ofrece automatizar la contabilidad?","options":["Más papeleo","Menos tiempo invertido y menor margen de error","Imposibilidad de analizar datos","Obligación de escribir todo a mano"],"answer":1,"why":"El texto destaca ahorro de tiempo, menos papel y mayor precisión.","source":"Software contable · Importancia"},{"id":"q48","topic":"software","q":"¿El software contable sustituye totalmente al contador?","options":["Sí, siempre","No; el profesional debe supervisar y verificar registros","Sí, porque ya no existen principios contables","Solo si se usa Excel"],"answer":1,"why":"El material indica que el contador sigue siendo necesario para asegurar calidad de registros.","source":"Software contable · Para el contador"},{"id":"q49","topic":"software","q":"¿Qué debe valorarse al elegir un software contable?","options":["Solo la tipografía","Costos, necesidades, capacitación, soporte y seguridad","Solo el color de la interfaz","La cantidad de emojis"],"answer":1,"why":"El material aborda inversión, selección, capacitación y requisitos funcionales.","source":"Software contable · Beneficios y características"},{"id":"q50","topic":"software","q":"¿Cuál es una característica esencial del software contable?","options":["Interfaz difícil de aprender","Fácil manejo","Ausencia de copias de datos","Sin soporte"],"answer":1,"why":"La facilidad de uso reduce esfuerzo de capacitación.","source":"Software contable · Características"},{"id":"q51","topic":"software","q":"¿Para qué sirven los permisos de usuario en un software contable?","options":["Para difundir datos confidenciales","Para restringir acceso a información sensible","Para eliminar los controles","Para desactivar auditoría"],"answer":1,"why":"El documento resalta claves y permisos para proteger datos confidenciales.","source":"Software contable · Seguridad"},{"id":"q52","topic":"software","q":"¿Qué característica permite adaptarse al crecimiento de la empresa?","options":["Rigidez completa","Flexibilidad","Falta de informes","Ausencia de almacenamiento"],"answer":1,"why":"El sistema debe adaptarse a cambios en el plan contable y operaciones.","source":"Software contable · Flexibilidad"},{"id":"q53","topic":"software","q":"¿Qué tipo de software integra producción, distribución, administración y contabilidad?","options":["ERP o planificación empresarial","Solo una hoja de cálculo","Un editor de texto","Un reproductor multimedia"],"answer":0,"why":"Los ERP enlazan información de múltiples departamentos.","source":"Software contable · Tipos"},{"id":"q54","topic":"software","q":"¿Qué distingue al software contable online según el texto?","options":["Solo funciona en una PC sin conexión","Permite acceso por internet sin instalación local necesariamente","Es obligatoriamente gratuito","No puede usarse en móviles"],"answer":1,"why":"Se describe almacenamiento accesible desde internet y posibles apps móviles.","source":"Software contable · Tipos"},{"id":"q55","topic":"software","q":"¿Qué limitación atribuye el material a una hoja de cálculo básica?","options":["Integración automática de todos los procesos","Posibles errores manuales y falta de integración","Nunca permite registrar compras","Es siempre más segura que cualquier ERP"],"answer":1,"why":"Las plantillas básicas pueden no integrar operaciones ni prevenir errores contables.","source":"Software contable · Tipos"},{"id":"q56","topic":"software","q":"¿Qué implica la capacidad de generar informes?","options":["Impedir estadísticas","Obtener reportes sobre ventas, costos, inventario y otros datos","Usar solo un formato de papel","Eliminar saldos"],"answer":1,"why":"Los informes permiten monitorear operaciones en períodos o tiempo real.","source":"Software contable · Características"},{"id":"q57","topic":"software","q":"¿Qué desventaja se menciona del software personalizado?","options":["Siempre es gratis","Puede implicar alto costo y soporte especializado","No se adapta a necesidades específicas","No requiere desarrollo"],"answer":1,"why":"El documento indica inversión considerable y soporte para soluciones propias.","source":"Software contable · Tipos"}];

const root=document.getElementById('root');const $=id=>document.getElementById(id);const topic=id=>TOPICS.find(t=>t.id===id);const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');

function done(){return Object.values(state.hist).filter(x=>x.seen>0).length}function wrongIds(){return QUESTIONS.filter(q=>state.hist[q.id]?.wrong>0&&(!state.hist[q.id]?.lastCorrect))}function accuracy(){let h=Object.values(state.hist);let a=h.reduce((s,v)=>s+(v.right||0),0),b=h.reduce((s,v)=>s+(v.seen||0),0);return b?Math.round(a/b*100):0}
function updateNav(){let mobile=$('mobileNav');mobile.innerHTML=NAV.map(([id,label])=>`<option value="${id}">${label}</option>`).join('');mobile.value=state.screen;$('nav').innerHTML=NAV.map(([id,label,ico])=>`<button class="nav ${state.screen===id?'active':''}" data-nav="${id}">${icon(ico)}<span>${label}</span>${id==='errores'&&wrongIds().length?`<span class="navcount">${wrongIds().length}</span>`:''}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));mobile.onchange=e=>go(e.target.value);$('breadcrumb').textContent=`ESTUDIO / ${NAV.find(n=>n[0]===state.screen)?.[1].toUpperCase()}`}

function home(){return `<div class="hero"><div><div class="eyebrow" style="color:#b9aaff">TU CENTRO DE PREPARACIÓN</div><h1>Un examen más cerca.<br><span style="color:#b8a7ff">Vos más preparado.</span></h1><p>Todo el material reunido en un solo lugar. Repasá conceptos, practicá preguntas y fortalecé tus puntos débiles.</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:19px"><button class="btn primary" id="startNow">${icon('zap',16)} Empezar a practicar</button><button class="btn ghost" id="readNow">Ver temario</button></div></div><div class="herovisual"><span>∑</span></div></div><div class="sectionline"><h2>Tu progreso</h2><span class="source">Se guarda automáticamente en este dispositivo</span></div><div class="grid3"><div class="metric"><div class="head">${icon('check',15)} Preguntas vistas</div><div class="value">${done()}<span style="font-size:16px;color:#8190a9"> / ${QUESTIONS.length}</span></div><div class="progress"><div style="width:${done()/QUESTIONS.length*100}%"></div></div></div><div class="metric"><div class="head">${icon('target',15)} Aciertos acumulados</div><div class="value">${accuracy()}%</div><div class="sub">Todas las respuestas practicadas</div></div><div class="metric"><div class="head">${icon('alert',15)} Errores por recuperar</div><div class="value" style="color:${wrongIds().length?'var(--amber)':'var(--green)'}">${wrongIds().length}</div><div class="sub">Preguntas falladas aún no acertadas</div></div></div><div class="sectionline"><h2>Unidades de estudio</h2><span class="source">5 temas basados en tus archivos</span></div>${topicalCards()}<div class="sectionline"><h2>Ruta recomendada</h2></div><div class="grid2"><div class="panel"><div style="display:flex;gap:11px;align-items:center">${icon('book',24)} <b>1 · Comprendé los conceptos</b></div><p class="muted smalltext">Leé los resúmenes por unidad y repasá las definiciones.</p><button class="btn small" data-route="temario">Ver apuntes ${icon('arrow',14)}</button></div><div class="panel"><div style="display:flex;gap:11px;align-items:center">${icon('target',24)} <b>2 · Ponete a prueba</b></div><p class="muted smalltext">Respondé, revisá cada explicación y repetí los errores.</p><button class="btn small" data-route="practica">Practicar ahora ${icon('arrow',14)}</button></div></div><p class="notice">Contenido elaborado únicamente a partir de los archivos compartidos. Las preguntas son simuladas, no un examen oficial.</p>`}
function temario(){return `${header('Temario de estudio','Resúmenes breves para entender antes de memorizar.')}<div class="toolbar" id="topicFilters"><button class="tag ${state.topic==='all'?'on':''}" data-filter="all">Todos</button>${TOPICS.map(t=>`<button class="tag ${state.topic===t.id?'on':''}" data-filter="${t.id}">${t.name}</button>`).join('')}</div><input class="search" placeholder="Buscar un concepto o definición..." id="termSearch" value="${esc(state.search)}"><div id="notes" style="margin-top:18px"></div>`}
function drawNotes(){const area=$('notes');if(!area)return;let s=state.search.toLocaleLowerCase().trim();let out=[];TOPICS.filter(t=>state.topic==='all'||t.id===state.topic).forEach(t=>{let sections=t.sections.filter(([a,b])=>!s||`${a} ${b} ${t.name}`.toLowerCase().includes(s));if(sections.length)out.push(`<div class="sectionline" style="margin-top:23px"><div><span class="pill">${t.name}</span><h2 style="margin-top:9px">${t.short}</h2></div></div>${sections.map(([a,b])=>`<div class="note"><h3>${a}</h3><p>${b}</p><div class="source" style="margin-top:13px">Fuente: ${esc(t.source)}</div></div>`).join('')}`)});area.innerHTML=out.join('')||'<div class="empty">No se encontraron conceptos para esta búsqueda.</div>'}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function practice(){return `${header('Práctica inteligente','Preguntas de opción múltiple con explicación inmediata.')}${state.quiz?quizView():`<div class="columns"><div class="panel"><div class="eyebrow">ELEGÍ EL TEMA</div><div class="toolbar"><button class="tag ${state.topic==='all'?'on':''}" data-filter="all">Todos (${QUESTIONS.length})</button>${TOPICS.map(t=>`<button class="tag ${state.topic===t.id?'on':''}" data-filter="${t.id}">${t.name}</button>`).join('')}</div><div class="hint">Las preguntas salen mezcladas para que practiques sin memorizar el orden. Se explica cada respuesta al corregir.</div><div class="space"></div><button class="btn primary" id="startPractice">${icon('zap',17)} Iniciar práctica</button></div><div class="panel"><b>Tu rendimiento</b><div class="kv"><span class="muted">Preguntas disponibles</span><b>${QUESTIONS.filter(q=>state.topic==='all'||q.topic===state.topic).length}</b></div><div class="kv"><span class="muted">Acierto histórico</span><b>${accuracy()}%</b></div><div class="kv"><span class="muted">Pendientes de recuperación</span><b>${wrongIds().length}</b></div><p class="notice">Podés salir y volver a empezar cuando quieras.</p></div></div>`}`}
function beginQuiz(which='practice',set=null){let pool=set||QUESTIONS.filter(q=>state.topic==='all'||q.topic===state.topic);if(!pool.length){go('errores');return}state.quiz={ids:shuffle(pool.map(q=>q.id)),at:0,chosen:null,checked:false,right:0,wrong:0,which};render()}
function quizView(){let qu=state.quiz; if(qu.at>=qu.ids.length){let total=qu.ids.length;return `<div class="panel" style="text-align:center;padding:42px 20px"><span class="eyebrow">SESIÓN FINALIZADA</span><div class="results">${Math.round(qu.right/total*100)}%</div><h2>Terminaste esta ronda</h2><p class="muted">${qu.right} correctas · ${qu.wrong} incorrectas · ${total} preguntas</p><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="btn primary" id="again">Otra ronda</button><button class="btn" data-route="errores">Revisar errores</button></div></div>`}
let x=QUESTIONS.find(q=>q.id===qu.ids[qu.at]);return `<div class="columns"><div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span class="pill">${topic(x.topic).name}</span><span class="source">Pregunta ${qu.at+1} de ${qu.ids.length}</span></div><div class="progress" style="margin-top:14px"><div style="width:${(qu.at+1)/qu.ids.length*100}%"></div></div><h2 class="question">${esc(x.q)}</h2>${x.options.map((o,i)=>`<button class="answer ${qu.chosen===i?'selected':''} ${qu.checked&&i===x.answer?'correct':''} ${qu.checked&&qu.chosen===i&&i!==x.answer?'wrong':''}" data-answer="${i}" ${qu.checked?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}${qu.checked?`<div class="feedback ${qu.chosen!==x.answer?'bad':''}"><b>${qu.chosen===x.answer?'✓ ¡Correcto!':'Respuesta incorrecta'}</b><p>${esc(x.why)}</p><div class="source" style="margin-top:7px">Fuente: ${esc(x.source)}</div></div>`:''}<div class="footer-actions"><button class="btn ghost small" id="leavePractice">Salir</button><button class="btn primary" id="checkOrNext" ${qu.chosen===null&&!qu.checked?'disabled':''}>${qu.checked?(qu.at===qu.ids.length-1?'Ver resultados':'Siguiente pregunta'):'Comprobar respuesta'} ${icon('arrow',16)}</button></div></div><div class="panel"><div class="eyebrow">SESIÓN ACTUAL</div><div class="kv"><span class="muted">Aciertos</span><b style="color:var(--green)">${qu.right}</b></div><div class="kv"><span class="muted">Errores</span><b style="color:var(--red)">${qu.wrong}</b></div><div class="kv"><span class="muted">Restantes</span><b>${qu.ids.length-qu.at-(qu.checked?1:0)}</b></div><p class="notice">Cada respuesta actualiza automáticamente tus estadísticas.</p></div></div>`}
function errors(){let items=wrongIds();return `${header('Mis errores', 'Repasá solo lo que todavía cuesta. Una respuesta correcta aquí recupera el error.')}${items.length?`<div class="panel"><div class="kv"><div><b>${items.length} conceptos para reforzar</b><p class="muted smalltext" style="margin:3px 0">La práctica adaptativa empieza con tus respuestas incorrectas.</p></div><button class="btn primary" id="retryWrong">${icon('rotate',16)} Repasar errores</button></div>${items.map(q=>`<div class="listrow"><b>${esc(q.q)}</b><div class="source">${topic(q.topic).name} · ${esc(q.source)}</div></div>`).join('')}</div>`:`<div class="panel empty">${icon('check',36)}<h2 style="color:var(--text)">Sin errores pendientes</h2><p>Cuando falles una pregunta, aparecerá acá hasta que la respondas correctamente.</p><button class="btn primary" data-route="practica">Ir a practicar</button></div>`}`}
function flashcard(){let list=FLASH.filter(f=>state.flashTopic==='all'||f[0]===state.flashTopic),f=list[state.flashIndex%list.length];return `${header('Flashcards', 'Memorizá definiciones: tocá la tarjeta para ver la respuesta.')}<div class="toolbar"><button class="tag ${state.flashTopic==='all'?'on':''}" data-flashtopic="all">Todos</button>${TOPICS.map(t=>`<button class="tag ${state.flashTopic===t.id?'on':''}" data-flashtopic="${t.id}">${t.name}</button>`).join('')}</div><div class="panel"><div style="display:flex;justify-content:space-between;margin-bottom:15px"><span class="pill">${topic(f[0]).name}</span><span class="source">${state.flashIndex%list.length+1} / ${list.length}</span></div><button class="face" id="flip"><span class="eyebrow" style="color:#c1b5fd">${state.flashBack?'RESPUESTA':'CONCEPTO'}</span>${state.flashBack?`<p style="font-size:18px;color:#e6e8fc">${esc(f[2])}</p>`:`<h2>${esc(f[1])}</h2>`}<span style="font-size:12px;color:#a6add5">Tocá para ${state.flashBack?'ver el concepto':'revelar la respuesta'}</span></button><div class="footer-actions"><button class="btn" id="flashPrev">Anterior</button><button class="btn primary" id="flashNext">Siguiente ${icon('arrow',16)}</button></div></div>`}
function exam(){return `${header('Simulacro de examen','Poné a prueba tu preparación sin ver las respuestas hasta el final.')}${state.exam?examView():`<div class="columns"><div class="panel"><div class="eyebrow">CONFIGURAR SIMULACRO</div><h2>¿Listo para rendir?</h2><p class="muted">Un examen cronometrado sobre los cinco temas, con preguntas mezcladas y revisión final.</p><div class="space"></div><label class="muted" for="examCount">Cantidad de preguntas</label><div class="space"></div><select class="select" id="examCount"><option value="10">10 preguntas · 15 minutos</option><option value="20" selected>20 preguntas · 30 minutos</option><option value="30">30 preguntas · 45 minutos</option><option value="${QUESTIONS.length}">Todas (${QUESTIONS.length}) · 90 minutos</option></select><div class="space"></div><button class="btn primary" id="startExam">${icon('clock',16)} Empezar simulacro</button></div><div class="panel"><b>Reglas</b><div class="kv"><span class="muted">Modalidad</span><b>Opción múltiple</b></div><div class="kv"><span class="muted">Corrección</span><b>Al terminar</b></div><div class="kv"><span class="muted">Tiempo</span><b>Limitado</b></div><p class="notice">Se trata de una práctica basada en los archivos, no de preguntas oficiales.</p></div></div>`}`}
let timer=null;
function startExam(){let n=+$('examCount').value;state.exam={ids:shuffle(QUESTIONS.map(q=>q.id)).slice(0,n),at:0,answers:{},end:Date.now()+ (n===QUESTIONS.length?90:n===10?15:n===20?30:45)*60*1000,finished:false};render()}
function finishExam(){if(!state.exam||state.exam.finished)return;state.exam.finished=true;let ex=state.exam,correct=0;ex.ids.forEach(id=>{const x=QUESTIONS.find(q=>q.id===id);let a=ex.answers[id];if(a===undefined)return;let good=a===x.answer;correct+=Number(good);record(x,good)});ex.right=correct;state.sessions.push({time:Date.now(),score:Math.round(correct/ex.ids.length*100),total:ex.ids.length});save();render()}
function examView(){let e=state.exam;if(e.finished)return `<div class="panel" style="text-align:center"><span class="eyebrow">RESULTADO DEL SIMULACRO</span><div class="results" style="color:${e.right/e.ids.length>=.7?'var(--green)':'var(--amber)'}">${Math.round(e.right/e.ids.length*100)}%</div><h2>${e.right} de ${e.ids.length} correctas</h2><p class="muted">Revisá cuáles eran las respuestas correctas y por qué.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0"><button class="btn primary" id="repeatExam">Nuevo simulacro</button><button class="btn" data-route="errores">Practicar errores</button></div></div><div style="height:15px"></div>${e.ids.map((id,i)=>{let x=QUESTIONS.find(q=>q.id===id),answer=e.answers[id];return `<div class="note"><div class="eyebrow">Pregunta ${i+1} · ${topic(x.topic).name}</div><h3 style="margin:7px 0">${esc(x.q)}</h3><p style="color:${answer===x.answer?'var(--green)':'var(--red)'}">Tu respuesta: ${answer===undefined?'Sin responder':esc(x.options[answer])}</p><p style="color:var(--green)">Correcta: ${esc(x.options[x.answer])}</p><p>${esc(x.why)}</p><div class="source" style="margin-top:8px">${esc(x.source)}</div></div>`}).join('')}`;let x=QUESTIONS.find(q=>q.id===e.ids[e.at]);return `<div class="columns"><div class="panel"><div class="kv" style="padding-top:0"><span class="pill">${topic(x.topic).name}</span><span class="examtime" id="timer">--:--</span></div><div class="progress" style="margin-top:13px"><div style="width:${(e.at+1)/e.ids.length*100}%"></div></div><div class="source" style="margin-top:12px">Pregunta ${e.at+1} de ${e.ids.length} · ${Object.keys(e.answers).length} respondidas</div><h2 class="question">${esc(x.q)}</h2>${x.options.map((o,i)=>`<button class="answer ${e.answers[x.id]===i?'selected':''}" data-examanswer="${i}"><span class="letter">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}<div class="footer-actions"><button class="btn ghost" id="examPrev" ${e.at===0?'disabled':''}>Anterior</button><div style="display:flex;gap:8px"><button class="btn" id="examNext" ${e.at===e.ids.length-1?'disabled':''}>Siguiente</button><button class="btn primary" id="examFinish">Finalizar</button></div></div></div><div class="panel"><b>Hoja de respuestas</b><p class="muted smalltext">Saltá a la pregunta que quieras.</p><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">${e.ids.map((id,i)=>`<button class="tag ${e.at===i?'on':''}" data-examjump="${i}" style="background:${e.answers[id]!==undefined?'#2a315b':''}">${i+1}</button>`).join('')}</div><p class="notice">Las respuestas y explicaciones se muestran al finalizar.</p></div></div>`}
function record(x,good){let v=state.hist[x.id]||{seen:0,right:0,wrong:0,lastCorrect:false};v.seen++;v.right+=Number(good);v.wrong+=Number(!good);v.lastCorrect=good;state.hist[x.id]=v;save()}
function render(){if(timer){clearInterval(timer);timer=null}updateNav();root.innerHTML=({home,temario,practica:practice,flash:flashcard,errores:errors,examen:exam})[state.screen]();bind();if(state.screen==='temario')drawNotes();if(state.exam&&!state.exam.finished){updateTime();timer=setInterval(updateTime,1000)}}
function updateTime(){if(!state.exam||state.exam.finished)return;let left=Math.max(0,Math.ceil((state.exam.end-Date.now())/1000));let c=$('timer');if(c)c.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(!left)finishExam()}
function bind(){document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>go(b.dataset.route));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{state.topic=b.dataset.topic;go('temario')});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.topic=b.dataset.filter;render()});document.querySelectorAll('[data-flashtopic]').forEach(b=>b.onclick=()=>{state.flashTopic=b.dataset.flashtopic;state.flashIndex=0;state.flashBack=false;render()});const find=id=>$(id);if(find('startNow'))find('startNow').onclick=()=>go('practica');if(find('readNow'))find('readNow').onclick=()=>go('temario');if(find('termSearch'))find('termSearch').oninput=e=>{state.search=e.target.value;drawNotes()};if(find('startPractice'))find('startPractice').onclick=()=>beginQuiz();if(find('retryWrong'))find('retryWrong').onclick=()=>{state.screen='practica';beginQuiz('errors',wrongIds())};if(find('again'))find('again').onclick=()=>beginQuiz();document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{state.quiz.chosen=+b.dataset.answer;render()});if(find('leavePractice'))find('leavePractice').onclick=()=>{state.quiz=null;render()};if(find('checkOrNext'))find('checkOrNext').onclick=()=>{let v=state.quiz,x=QUESTIONS.find(q=>q.id===v.ids[v.at]);if(!v.checked){v.checked=true;let good=v.chosen===x.answer;v.right+=Number(good);v.wrong+=Number(!good);record(x,good)}else{v.at++;v.checked=false;v.chosen=null}render()};if(find('flip'))find('flip').onclick=()=>{state.flashBack=!state.flashBack;render()};if(find('flashPrev'))find('flashPrev').onclick=()=>{let len=FLASH.filter(f=>state.flashTopic==='all'||f[0]===state.flashTopic).length;state.flashIndex=(state.flashIndex+len-1)%len;state.flashBack=false;render()};if(find('flashNext'))find('flashNext').onclick=()=>{state.flashIndex++;state.flashBack=false;render()};if(find('startExam'))find('startExam').onclick=startExam;if(find('examFinish'))find('examFinish').onclick=()=>{let missing=state.exam.ids.length-Object.keys(state.exam.answers).length;if(missing&&!confirm(`Te faltan ${missing} preguntas. ¿Finalizar igualmente?`))return;finishExam()};if(find('repeatExam'))find('repeatExam').onclick=()=>{state.exam=null;render()};if(find('examNext'))find('examNext').onclick=()=>{state.exam.at++;render()};if(find('examPrev'))find('examPrev').onclick=()=>{state.exam.at--;render()};document.querySelectorAll('[data-examjump]').forEach(b=>b.onclick=()=>{state.exam.at=+b.dataset.examjump;render()});document.querySelectorAll('[data-examanswer]').forEach(b=>b.onclick=()=>{let ex=state.exam;ex.answers[ex.ids[ex.at]]=+b.dataset.examanswer;render()})}
$('resetAll').onclick=()=>{if(confirm('¿Querés borrar todas las estadísticas y sesiones guardadas en este navegador?')){state.hist={};state.sessions=[];save();render()}};
render();
</script></body></html>
