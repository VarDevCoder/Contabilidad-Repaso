<script>
const TOPICS=[{"id":"empresa","name":"La empresa","short":"Origen, evolución y concepto","accent":"#7c83ff","source":"La Empresa.docx","sections":[["Concepto y propósito","Una empresa es una organización dedicada a producir bienes o prestar servicios demandados por consumidores. Busca satisfacer necesidades y, según el material, obtener un beneficio económico. Para funcionar necesita misión, objetivos, estrategia, políticas y planificación."],["Evolución histórica","Primitiva: caza, pesca y recolección con división del trabajo por edad y sexo. Grandes civilizaciones: control del trabajo y organización de recursos, como en Egipto. Grecolatina: esclavismo y supervisión. Edad Media: feudalismo, talleres artesanales y gremios. Edad Moderna: trabajo asalariado y capitalismo comercial. Revolución Industrial: mecanización, grandes fábricas y producción en serie. Siglo XX: consolidación de la administración. Siglo XXI: globalización, automatización, calidad y orientación al cliente."],["Qué recordar","Los talleres medievales son antecedentes de la empresa y los gremios de sindicatos actuales. La Revolución Industrial expandió las fábricas y transformó los procesos productivos. Una empresa puede adoptar distintas formas jurídicas y desarrollar una actividad económica."]]},{"id":"admin","name":"Administración","short":"Conceptos y características","accent":"#b18cff","source":"Origen y desarrollo de la administración (PDF)","sections":[["Definiciones de autores","Para Henri Fayol, administrar implica prever, organizar, dirigir, coordinar y controlar. José Antonio Fernández Arena pone el foco en objetivos institucionales mediante esfuerzo humano coordinado. Agustín Reyes Ponce la vincula con la máxima eficiencia en la estructura y manejo de un organismo social. George R. Terry habla de planeación, organización, ejecución y control."],["Cuatro características","Universalidad: existe donde hay organismos sociales. Especificidad: se distingue de fenómenos contables, productivos o jurídicos. Unidad temporal: sus fases coexisten en la práctica. Unidad jerárquica: distintos niveles de jefatura forman un mismo cuerpo administrativo."],["Por qué importa","Coordina recursos humanos y materiales, eleva productividad y contribuye a la eficacia. En grandes organizaciones es indispensable por su complejidad; en pequeñas y medianas puede mejorar su capacidad de competir. La administración pública se enfoca en organismos de orden público y la privada en los de tipo privado."]]},{"id":"formalizacion","name":"Formalización","short":"Economía formal y OIT","accent":"#46c8ae","source":"La formalización de las empresas, OIT (PDF)","sections":[["Definición","La formalización consiste en la incorporación gradual de empresas a la economía formal. Incluye registro y licencias, seguridad social y cumplimiento de normas tributarias y laborales. No necesariamente ocurre todo de una sola vez."],["Objetivos y beneficios","La OIT promueve crear más y mejores empleos, reducir pobreza y vulnerabilidad y mejorar condiciones de trabajo. Para una empresa, formalizarse puede facilitar financiación, acceso a mercados y licitaciones, y reducir la exposición a sanciones. Para la sociedad, puede ampliar ingresos fiscales y favorecer la competencia leal."],["Medidas e intervención","Simplificar trámites y costos, ofrecer incentivos y acceso a servicios, mejorar productividad y capacitación, promover diálogo y cumplimiento legal. El documento menciona la Recomendación núm. 204 de la OIT y la meta ODS 8.3."]]},{"id":"contabilidad","name":"Contabilidad y gestión","short":"Información para decidir","accent":"#f0bd67","source":"Tarea Nº 1 — Importancia de la Contabilidad.docx","sections":[["Papel de la contabilidad","Registra, clasifica y resume sistemáticamente las operaciones económicas para producir información confiable, oportuna y verificable de la situación patrimonial y los resultados de la empresa."],["Para qué sirve","La contabilidad es una herramienta de gestión que permite tomar decisiones fundamentadas, y no solo cumplir obligaciones tributarias. Sus informes son relevantes para directivos, inversionistas, proveedores y entidades públicas."],["Responsabilidad del profesional","Debe proteger la calidad, transparencia y exactitud de los datos. El documento destaca responsabilidad ética y técnica, rigor, orden y vocabulario contable adecuado."]]},{"id":"software","name":"Software contable","short":"Funciones, tipos y beneficios","accent":"#5fb4ef","source":"EL SOFTWARE CONTABLE.docx","sections":[["Qué es y qué hace","Es un programa computarizado que centraliza la información financiera y registra operaciones como compras, ventas, inventarios y cuentas por cobrar. Puede generar informes, balances y estados financieros, realizar seguimiento diario y brindar datos oportunos."],["Ventajas y límites","Reduce papeleo, tiempos y errores; mejora el acceso a información para decidir. Requiere inversión, selección adecuada, capacitación, soporte y actualización. No reemplaza la supervisión del profesional contable."],["Características esenciales","Fácil manejo, actualización y soporte técnico, informes, flexibilidad, capacidad de almacenamiento, seguridad por permisos y unificación de procesos."],["Tipos mencionados","Hojas de cálculo, software personalizado, comercial, ERP, gratuito y en línea. El ERP integra departamentos; el online permite acceso mediante internet; una hoja de cálculo básica puede carecer de integración y controles contables."]]}];
const QUESTIONS=[{"id":"q01","topic":"empresa","q":"Según el material, ¿qué hace principalmente una empresa?","options":["Administra únicamente recursos del Estado","Produce bienes o presta servicios para atender necesidades","Se dedica exclusivamente a tributar","Reemplaza a los consumidores"],"answer":1,"why":"La empresa desarrolla actividad económica mediante bienes o servicios que responden a demandas.","source":"La Empresa · Introducción"},{"id":"q02","topic":"empresa","q":"¿Qué elemento se considera necesario para orientar una empresa?","options":["Misión y objetivos claros","Ausencia de estrategia","Exclusión de normas","Solo un logotipo"],"answer":0,"why":"El material destaca misión, objetivos, estrategia y planificación.","source":"La Empresa · Introducción"},{"id":"q03","topic":"empresa","q":"¿Qué actividades predominaron en la época primitiva?","options":["Banca digital y exportaciones","Caza, pesca y recolección","Producción fabril en serie","Comercio electrónico"],"answer":1,"why":"Los grupos se organizaban para subsistir mediante esas actividades.","source":"La Empresa · Época Primitiva"},{"id":"q04","topic":"empresa","q":"¿Cómo se dividía inicialmente el trabajo según el material?","options":["Por acciones bursátiles","Por edad y sexo","Por nacionalidad de las empresas","Por licencia de software"],"answer":1,"why":"El texto describe división del trabajo por edad y sexo.","source":"La Empresa · Época Primitiva"},{"id":"q05","topic":"empresa","q":"¿Qué ejemplo ilustra la administración en las grandes civilizaciones?","options":["Las pirámides de Egipto","Las aplicaciones móviles","Las redes sociales","Los microprocesadores"],"answer":0,"why":"Construcciones como las pirámides exigían coordinación y supervisión del trabajo.","source":"La Empresa · Grandes Civilizaciones"},{"id":"q06","topic":"empresa","q":"¿Qué caracterizó a la administración de la Antigüedad Grecolatina según el material?","options":["Automatización","Cooperativismo digital","Esclavismo y estricta supervisión","Oficinas virtuales"],"answer":2,"why":"El documento describe un modelo coercitivo sustentado en esclavismo.","source":"La Empresa · Antigüedad Grecolatina"},{"id":"q07","topic":"empresa","q":"¿Qué organización aparece vinculada a la Edad Media?","options":["Talleres artesanales y gremios","Corporaciones multinacionales digitales","Startups de IA","Fábricas automatizadas"],"answer":0,"why":"Los maestros, oficiales y aprendices trabajaban en talleres; surgieron gremios.","source":"La Empresa · Edad Media"},{"id":"q08","topic":"empresa","q":"¿A qué organizaciones actuales se consideran antecedentes los gremios medievales?","options":["Bancos centrales","Sindicatos","Plataformas de streaming","Laboratorios"],"answer":1,"why":"El texto identifica a los gremios como antecedentes de los sindicatos.","source":"La Empresa · Edad Media"},{"id":"q09","topic":"empresa","q":"¿Qué cambio acompañó a la Edad Moderna según el documento?","options":["Desaparición total del comercio","Capitalismo comercial y trabajo asalariado","Invención de la nube","Fin de la administración"],"answer":1,"why":"Se describe la contratación de campesinos asalariados y el aumento del comercio.","source":"La Empresa · Edad Moderna"},{"id":"q10","topic":"empresa","q":"¿Cuál fue una consecuencia de la Revolución Industrial?","options":["El fin de toda fábrica","La sustitución de todas las empresas por gremios","Mecanización y producción en serie","La desaparición de las ciudades"],"answer":2,"why":"La mecanización permitió expandir grandes fábricas y producción en serie.","source":"La Empresa · Revolución Industrial"},{"id":"q11","topic":"empresa","q":"En el siglo XX, la administración se consolidó como...","options":["Una actividad innecesaria","Una disciplina para lograr mayor eficiencia","Un tipo de impuesto","Un sistema de trueque"],"answer":1,"why":"El avance industrial hizo esencial coordinar organizaciones complejas.","source":"La Empresa · Siglo XX"},{"id":"q12","topic":"empresa","q":"¿Qué rasgo destaca en las empresas del siglo XXI?","options":["Aislamiento total de mercados","Retorno exclusivo al feudalismo","Globalización, automatización y competitividad","Eliminación de los clientes"],"answer":2,"why":"El texto vincula el siglo XXI con globalización, tecnología y orientación al cliente.","source":"La Empresa · Siglo XXI"},{"id":"q13","topic":"admin","q":"¿A qué autor se atribuye prever, organizar, dirigir, coordinar y controlar?","options":["George R. Terry","Henri Fayol","Agustín Reyes Ponce","James Watt"],"answer":1,"why":"Es la formulación de administrar de Henri Fayol.","source":"Origen y desarrollo · Conceptos"},{"id":"q14","topic":"admin","q":"¿Cuál de estas definiciones corresponde a José Antonio Fernández Arena?","options":["Una ciencia social orientada a objetivos institucionales mediante esfuerzo humano coordinado","Un simple registro de facturas","Un programa para ventas","Una organización sin objetivos"],"answer":0,"why":"El autor enfatiza una estructura y el esfuerzo humano coordinado.","source":"Origen y desarrollo · Conceptos"},{"id":"q15","topic":"admin","q":"¿Quién relaciona la administración con la máxima eficiencia de un organismo social?","options":["Agustín Reyes Ponce","James Watt","Henri Ford","Adam Smith"],"answer":0,"why":"Reyes Ponce la describe como conjunto sistemático de reglas para lograr máxima eficiencia.","source":"Origen y desarrollo · Conceptos"},{"id":"q16","topic":"admin","q":"¿Qué secuencia se menciona en la definición de George R. Terry?","options":["Registro, facturación, archivo, venta","Planeación, organización, ejecución y control","Comprar, vender, publicar y cerrar","Cazar, pescar y recolectar"],"answer":1,"why":"Terry la presenta como un proceso distintivo con esas cuatro actividades.","source":"Origen y desarrollo · Conceptos"},{"id":"q17","topic":"admin","q":"¿Qué significa universalidad de la administración?","options":["Solo existe en empresas grandes","Está presente donde existe un organismo social","Solo se aplica a contadores","Es específica de un país"],"answer":1,"why":"Puede encontrarse en Estado, empresas, ejército y otras organizaciones.","source":"Origen y desarrollo · Características"},{"id":"q18","topic":"admin","q":"¿A qué se refiere la especificidad administrativa?","options":["Es idéntica a la contabilidad","Siempre opera sin personas","Es distinta de fenómenos técnicos, jurídicos y contables","Solo se estudia en universidades"],"answer":2,"why":"La función administrativa conserva identidad propia aunque conviva con otras funciones.","source":"Origen y desarrollo · Características"},{"id":"q19","topic":"admin","q":"¿Qué expresa la unidad temporal?","options":["Que planear impide controlar","Que las fases administrativas pueden coexistir","Que solo se administra una hora al día","Que las etapas nunca se relacionan"],"answer":1,"why":"Planear, organizar, dirigir y controlar pueden darse simultáneamente.","source":"Origen y desarrollo · Características"},{"id":"q20","topic":"admin","q":"¿Qué significa unidad jerárquica?","options":["Solo manda el propietario","Los niveles de autoridad participan en un mismo cuerpo administrativo","No existen supervisores","Todos tienen exactamente las mismas atribuciones"],"answer":1,"why":"Jefaturas de distintos niveles participan en una misma administración.","source":"Origen y desarrollo · Características"},{"id":"q21","topic":"admin","q":"¿Por qué es importante administrar bien en una pyme?","options":["Para evitar toda competencia","Para coordinar recursos y mejorar competitividad","Para eliminar el personal","Para prescindir de objetivos"],"answer":1,"why":"El material señala la mejora administrativa como vía para competir con organizaciones mayores.","source":"Origen y desarrollo · Importancia"},{"id":"q22","topic":"admin","q":"¿Cuál es un resultado de una administración adecuada?","options":["Reducción inevitable de productividad","Mejora de productividad","Desaparición del mercado","Ausencia de coordinación"],"answer":1,"why":"La buena administración ayuda a coordinar recursos y elevar la productividad.","source":"Origen y desarrollo · Importancia"},{"id":"q23","topic":"admin","q":"¿Cuál es la diferencia planteada entre administración pública y privada?","options":["El idioma usado","La pública busca eficiencia en organismos de orden público; la privada en organismos privados","La pública no organiza nada","La privada no puede controlar"],"answer":1,"why":"La distinción del artículo depende del tipo de organismo social.","source":"Origen y desarrollo · Pública y privada"},{"id":"q24","topic":"admin","q":"¿Cuándo surge la administración, según el artículo?","options":["Solo con las computadoras","Cuando las personas comienzan a trabajar organizadamente en sociedad","Al inventarse la web","Solo después de 2000"],"answer":1,"why":"El artículo sitúa sus antecedentes en la cooperación y organización humana.","source":"Origen y desarrollo · Administración general"},{"id":"q25","topic":"formalizacion","q":"¿Qué es formalizar una empresa según la OIT?","options":["Trasladarla de ciudad","Incorporarla a la economía formal","Cerrar sus operaciones","Cambiar únicamente el logo"],"answer":1,"why":"La definición de la OIT es la incorporación a la economía formal.","source":"OIT · p. 1"},{"id":"q26","topic":"formalizacion","q":"¿Cuál es una dimensión de la formalización?","options":["Registro y licencias ante autoridades","Eliminar registros tributarios","Ocultar empleados","Evitar las leyes laborales"],"answer":0,"why":"Incluye registro, licencias, seguridad social y cumplimiento legal.","source":"OIT · p. 1"},{"id":"q27","topic":"formalizacion","q":"La formalización de una empresa es un proceso...","options":["Siempre instantáneo","Gradual","Prohibido para pymes","Exclusivamente tecnológico"],"answer":1,"why":"Una empresa puede formalizar aspectos en distintos momentos.","source":"OIT · p. 1"},{"id":"q28","topic":"formalizacion","q":"¿Qué objetivo destaca la OIT al promover formalización?","options":["Crear más y mejores empleos","Evitar los aportes de seguridad social","Eliminar controles","Reducir la productividad"],"answer":0,"why":"Se busca más trabajo decente, menos pobreza y vulnerabilidad.","source":"OIT · p. 1"},{"id":"q29","topic":"formalizacion","q":"¿Qué beneficio puede ofrecer la formalización a una empresa?","options":["Acceder a financiación y mercados","Quedar exenta de toda norma","Garantizar ganancias ilimitadas","Nunca pagar impuestos"],"answer":0,"why":"El material menciona financiación, mercados, licitaciones y menor exposición a sanciones.","source":"OIT · p. 1"},{"id":"q30","topic":"formalizacion","q":"¿Qué efecto social se asocia con empresas formalizadas?","options":["Menor disponibilidad de servicios públicos por definición","Mayores ingresos fiscales para servicios públicos","Supresión del empleo","Imposibilidad de competir"],"answer":1,"why":"La formalización puede ampliar ingresos fiscales que financian bienes y servicios públicos.","source":"OIT · p. 1"},{"id":"q31","topic":"formalizacion","q":"¿Cuál de estas medidas favorece la formalización según la OIT?","options":["Trámites registrales más complejos","Reducir obstáculos al registro y cumplimiento","Suspender toda capacitación","Limitar acceso a mercados"],"answer":1,"why":"La OIT recomienda facilitar trámites y reducir obstáculos de entrada.","source":"OIT · p. 2"},{"id":"q32","topic":"formalizacion","q":"¿Qué recomendación de la OIT se menciona sobre transición a la economía formal?","options":["Recomendación 204","Recomendación 10","Recomendación 500","Recomendación 1"],"answer":0,"why":"El documento cita expresamente la Recomendación núm. 204.","source":"OIT · p. 2"},{"id":"q33","topic":"formalizacion","q":"En el modelo de intervención de la OIT, ¿qué aparece como resultado final?","options":["Más empleo de calidad y menor vulnerabilidad","Más papeleo necesariamente","Desaparición de los mercados","Menos cohesión social"],"answer":0,"why":"El esquema plantea mejora del empleo, reducción de vulnerabilidad y cohesión social.","source":"OIT · p. 2, diagrama"},{"id":"q34","topic":"formalizacion","q":"La formalización también busca reducir...","options":["La seguridad jurídica","La competencia desleal de empresas informales","La información empresarial","La cobertura social"],"answer":1,"why":"La OIT indica que reduce competencia desleal para empresas que cumplen sus obligaciones.","source":"OIT · p. 1"},{"id":"q35","topic":"contabilidad","q":"¿Qué operaciones realiza la contabilidad según la tarea?","options":["Registra, clasifica y resume operaciones económicas","Solo diseña campañas publicitarias","Únicamente recluta empleados","Borra la información financiera"],"answer":0,"why":"La tarea define estas funciones para producir información fiable.","source":"Tarea Nº 1 · Párrafo 1"},{"id":"q36","topic":"contabilidad","q":"¿Qué información aporta la contabilidad?","options":["Solo inventario de muebles","Situación patrimonial y resultados de la empresa","El color del logotipo","Únicamente horarios"],"answer":1,"why":"Informa sobre patrimonio y resultados para apoyar decisiones.","source":"Tarea Nº 1 · Párrafo 1"},{"id":"q37","topic":"contabilidad","q":"¿Para qué sirve la contabilidad además de cumplir obligaciones fiscales?","options":["Solo aumentar archivos físicos","Apoyar la toma de decisiones empresariales","Eliminar toda auditoría","Impedir el análisis"],"answer":1,"why":"La tarea recalca que es una herramienta de gestión, no solo tributaria.","source":"Tarea Nº 1 · Párrafos 2–3"},{"id":"q38","topic":"contabilidad","q":"¿Qué cualidades debe tener la información contable?","options":["Ambigua y tardía","Confiable, oportuna y verificable","Secreta para toda la empresa","Solo aproximada"],"answer":1,"why":"La tarea emplea esas tres cualidades de la información contable.","source":"Tarea Nº 1 · Párrafo 1"},{"id":"q39","topic":"contabilidad","q":"¿Quiénes pueden usar la información contable?","options":["Solo empleados del área de limpieza","Directivos, inversionistas y entidades públicas, entre otros","Exclusivamente desarrolladores","Nadie fuera del banco"],"answer":1,"why":"Diferentes interesados necesitan información para decidir.","source":"Tarea Nº 1 · Párrafo 2"},{"id":"q40","topic":"contabilidad","q":"¿Qué responsabilidad destaca en el profesional contable?","options":["Rigor ético y técnico","Ocultar errores sin registro","Evitar supervisión","Garantizar utilidades"],"answer":0,"why":"La calidad de los datos afecta la confianza de interesados.","source":"Tarea Nº 1 · Párrafo 2"},{"id":"q41","topic":"contabilidad","q":"En el trabajo, ¿cómo se caracteriza a la empresa?","options":["Unidad económico-social con recursos humanos, materiales, técnicos y financieros","Un tipo de computadora","Un edificio exclusivamente","Una entidad sin personas"],"answer":0,"why":"El primer párrafo describe los recursos y el propósito económico-social.","source":"Tarea Nº 1 · Párrafo 1"},{"id":"q42","topic":"contabilidad","q":"¿Qué impulsa la competencia según la tarea?","options":["La mejora continua en calidad, precio y servicio","La suspensión total de actividad","La desaparición de clientes","La obligación de usar un software"],"answer":0,"why":"La competencia puede estimular mejores productos y servicios.","source":"Tarea Nº 1 · Párrafo 1"},{"id":"q43","topic":"contabilidad","q":"¿Qué visión del aprendizaje expresa la tarea?","options":["La contabilidad solo existe por impuestos","La contabilidad es un lenguaje de los negocios para gestionar con transparencia","Los datos financieros no importan","La gestión debe evitar números"],"answer":1,"why":"El cierre la presenta como herramienta de gestión y lenguaje empresarial.","source":"Tarea Nº 1 · Párrafo 3"},{"id":"q44","topic":"software","q":"¿Qué es un software contable?","options":["Un juego comercial","Un programa que integra información financiera y facilita operaciones contables","Una red social","Una impresora"],"answer":1,"why":"El documento lo define como programa computarizado con datos financieros integrados.","source":"Software contable · Definición"},{"id":"q45","topic":"software","q":"¿Qué operaciones puede registrar un software contable?","options":["Ventas, compras, inventarios y cuentas por cobrar","Solo fotografías de productos","Únicamente llamadas","Solo correo electrónico"],"answer":0,"why":"Esas operaciones aparecen entre sus principales datos.","source":"Software contable · Definición"},{"id":"q46","topic":"software","q":"¿Cuál es un objetivo del software contable?","options":["Aumentar el trabajo duplicado","Centralizar información y ofrecer datos oportunos","Evitar todo informe","Eliminar toda contabilidad"],"answer":1,"why":"Los objetivos listan seguimiento diario, procesos ágiles, centralización e información oportuna.","source":"Software contable · Objetivos"},{"id":"q47","topic":"software","q":"¿Qué ventaja ofrece automatizar la contabilidad?","options":["Más papeleo","Menos tiempo invertido y menor margen de error","Imposibilidad de analizar datos","Obligación de escribir todo a mano"],"answer":1,"why":"El texto destaca ahorro de tiempo, menos papel y mayor precisión.","source":"Software contable · Importancia"},{"id":"q48","topic":"software","q":"¿El software contable sustituye totalmente al contador?","options":["Sí, siempre","No; el profesional debe supervisar y verificar registros","Sí, porque ya no existen principios contables","Solo si se usa Excel"],"answer":1,"why":"El material indica que el contador sigue siendo necesario para asegurar calidad de registros.","source":"Software contable · Para el contador"},{"id":"q49","topic":"software","q":"¿Qué debe valorarse al elegir un software contable?","options":["Solo la tipografía","Costos, necesidades, capacitación, soporte y seguridad","Solo el color de la interfaz","La cantidad de emojis"],"answer":1,"why":"El material aborda inversión, selección, capacitación y requisitos funcionales.","source":"Software contable · Beneficios y características"},{"id":"q50","topic":"software","q":"¿Cuál es una característica esencial del software contable?","options":["Interfaz difícil de aprender","Fácil manejo","Ausencia de copias de datos","Sin soporte"],"answer":1,"why":"La facilidad de uso reduce esfuerzo de capacitación.","source":"Software contable · Características"},{"id":"q51","topic":"software","q":"¿Para qué sirven los permisos de usuario en un software contable?","options":["Para difundir datos confidenciales","Para restringir acceso a información sensible","Para eliminar los controles","Para desactivar auditoría"],"answer":1,"why":"El documento resalta claves y permisos para proteger datos confidenciales.","source":"Software contable · Seguridad"},{"id":"q52","topic":"software","q":"¿Qué característica permite adaptarse al crecimiento de la empresa?","options":["Rigidez completa","Flexibilidad","Falta de informes","Ausencia de almacenamiento"],"answer":1,"why":"El sistema debe adaptarse a cambios en el plan contable y operaciones.","source":"Software contable · Flexibilidad"},{"id":"q53","topic":"software","q":"¿Qué tipo de software integra producción, distribución, administración y contabilidad?","options":["ERP o planificación empresarial","Solo una hoja de cálculo","Un editor de texto","Un reproductor multimedia"],"answer":0,"why":"Los ERP enlazan información de múltiples departamentos.","source":"Software contable · Tipos"},{"id":"q54","topic":"software","q":"¿Qué distingue al software contable online según el texto?","options":["Solo funciona en una PC sin conexión","Permite acceso por internet sin instalación local necesariamente","Es obligatoriamente gratuito","No puede usarse en móviles"],"answer":1,"why":"Se describe almacenamiento accesible desde internet y posibles apps móviles.","source":"Software contable · Tipos"},{"id":"q55","topic":"software","q":"¿Qué limitación atribuye el material a una hoja de cálculo básica?","options":["Integración automática let saved={},rawSaved=null,recoveryBlocked=false,recoveryNotice='';
try{
  rawSaved=localStorage.getItem('repaso-unibe-v1');
  saved=JSON.parse(rawSaved||'{}');
  if(!saved||typeof saved!=='object'||Array.isArray(saved))throw new Error('Formato de progreso inválido');
  if(saved.hist!=null&&(typeof saved.hist!=='object'||Array.isArray(saved.hist)))throw new Error('Historial inválido');
  if(saved.sessions!=null&&!Array.isArray(saved.sessions))throw new Error('Simulacros inválidos');
  if(saved.development!=null&&(typeof saved.development!=='object'||Array.isArray(saved.development)))throw new Error('Borradores inválidos');
}catch(e){
  saved={};
  if(rawSaved!==null){
    try{localStorage.setItem('repaso-unibe-recovery-'+Date.now(),rawSaved);recoveryNotice='No se pudo leer el progreso anterior. Se guardó una copia de recuperación en este navegador antes de iniciar una sesión vacía.'}
    catch(backupError){recoveryBlocked=true;recoveryNotice='No se pudo leer ni respaldar el progreso anterior. Se conserva sin sobrescribir; el avance de esta sesión no se guardará.'}
  }
}

function done(){return Object.values(state.hist).filter(x=>x.seen>0).length}function wrongIds(){return QUESTIONS.filter(q=>state.hist[q.id]?.wrong>0&&(!state.hist[q.id]?.lastCorrect))}function accuracy(){let h=Object.values(state.hist);let a=h.reduce((s,v)=>s+(v.right||0),0),b=h.reduce((s,v)=>s+(v.seen||0),0);return b?Math.round(a/b*100):0}

function exam(){return `${header('Simulacro de examen','Poné a prueba tu preparación sin ver las respuestas hasta el final.')}${state.exam?examView():`<div class="columns"><div class="panel"><div class="eyebrow">CONFIGURAR SIMULACRO</div><h2>¿Listo para rendir?</h2><p class="muted">Un examen cronometrado sobre los cinco temas, con preguntas mezcladas y revisión final.</p><div class="space"></div><label class="muted" for="examCount">Cantidad de preguntas</label><div class="space"></div><select class="select" id="examCount"><option value="10">10 preguntas · 15 minutos</option><option value="20" selected>20 preguntas · 30 minutos</option><option value="30">30 preguntas · 45 minutos</option><option value="${QUESTIONS.length}">Todas (${QUESTIONS.length}) · 90 minutos</option></select><div class="space"></div><button class="btn primary" id="startExam">${icon('clock',16)} Empezar simulacro</button></div><div class="panel"><b>Reglas</b><div class="kv"><span class="muted">Modalidad</span><b>Opción múltiple</b></div><div class="kv"><span class="muted">Corrección</span><b>Al terminar</b></div><div class="kv"><span class="muted">Tiempo</span><b>Limitado</b></div><p class="notice">Se trata de una práctica basada en los archivos, no de preguntas oficiales.</p></div></div>`}`}
let timer=null;
function startExam(){if(activeSession()){resumeSession();return}const n=+$('examCount').value;state.exam={ids:adaptive(QUESTIONS,n),at:0,answers:{},end:Date.now()+(n===QUESTIONS.length?90:n*1.5)*60000,finished:false};render()}
function finishExam(){const ex=state.exam;if(!ex||ex.finished)return;ex.finished=true;ex.paused=false;let correct=0,omitted=0;const units={};ex.ids.forEach(id=>{const x=QUESTIONS.find(q=>q.id===id),missing=ex.answers[id]===undefined,good=!missing&&ex.answers[id]===x.answer;correct+=Number(good);omitted+=Number(missing);record(x,good,missing);const u=units[x.topic]||(units[x.topic]={total:0,right:0,omitted:0});u.total++;u.right+=Number(good);u.omitted+=Number(missing)});ex.right=correct;ex.omitted=omitted;state.sessions.push({time:Date.now(),score:Math.round(correct/ex.ids.length*100),total:ex.ids.length,right:correct,omitted,units});save();render()}
function examView(){let e=state.exam;if(e.finished)return `<div class="panel" style="text-align:center"><span class="eyebrow">RESULTADO DEL SIMULACRO</span><div class="results" style="color:${e.right/e.ids.length>=.7?'var(--green)':'var(--amber)'}">${Math.round(e.right/e.ids.length*100)}%</div><h2>${e.right} de ${e.ids.length} correctas</h2><p class="muted">Revisá cuáles eran las respuestas correctas y por qué.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0"><button class="btn primary" id="repeatExam">Nuevo simulacro</button><button class="btn" data-route="errores">Practicar errores</button></div></div><div style="height:15px"></div>${e.ids.map((id,i)=>{let x=QUESTIONS.find(q=>q.id===id),answer=e.answers[id];return `<div class="note"><div class="eyebrow">Pregunta ${i+1} · ${topic(x.topic).name}</div><h3 style="margin:7px 0">${esc(x.q)}</h3><p style="color:${answer===x.answer?'var(--green)':'var(--red)'}">Tu respuesta: ${answer===undefined?'Omitida (incorrecta)':esc(x.options[answer])}</p><p style="color:var(--green)">Correcta: ${esc(x.options[x.answer])}</p><p>${esc(x.why)}</p><div class="source" style="margin-top:8px">${esc(x.source)}</div></div>`}).join('')}`;let x=QUESTIONS.find(q=>q.id===e.ids[e.at]);return `<div class="columns"><div class="panel"><div class="kv" style="padding-top:0"><span class="pill">${topic(x.topic).name}</span><span class="examtime" id="timer">--:--</span></div><div class="progress" style="margin-top:13px"><div style="width:${(e.at+1)/e.ids.length*100}%"></div></div><div class="source" style="margin-top:12px">Pregunta ${e.at+1} de ${e.ids.length} · ${Object.keys(e.answers).length} respondidas</div><h2 class="question">${esc(x.q)}</h2>${x.options.map((o,i)=>`<button class="answer ${e.answers[x.id]===i?'selected':''}" data-examanswer="${i}"><span class="letter">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}<div class="footer-actions"><button class="btn ghost" id="examPrev" ${e.at===0?'disabled':''}>Anterior</button><div style="display:flex;gap:8px"><button class="btn" id="examNext" ${e.at===e.ids.length-1?'disabled':''}>Siguiente</button><button class="btn primary" id="examFinish">Finalizar</button></div></div></div><div class="panel"><b>Hoja de respuestas</b><p class="muted smalltext">Saltá a la pregunta que quieras.</p><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">${e.ids.map((id,i)=>`<button class="tag ${e.at===i?'on':''}" data-examjump="${i}" style="background:${e.answers[id]!==undefined?'#2a315b':''}">${i+1}</button>`).join('')}</div><p class="notice">Las respuestas y explicaciones se muestran al finalizar.</p></div></div>`}
function record(x,good,omitted=false){const v=state.hist[x.id]||{seen:0,right:0,wrong:0,lastCorrect:false};v.seen++;v.right+=Number(good);v.wrong+=Number(!good);v.lastCorrect=good;v.lastAt=Date.now();v.lastOmitted=omitted;state.hist[x.id]=v}
function render(){
  if(timer){clearInterval(timer);timer=null}
  save();updateNav();
  const a=activeSession();
  const onSession=a&&state.screen===a.screen&&!a.value.paused;
  const banner=a?`<div class="session-bar">
    <span><strong>${a.kind==='exam'?'Simulacro':'Práctica'}</strong> · ${a.value.paused?'En pausa':'En curso'}</span>
    <div class="session-actions">
      ${onSession?'<button class="btn ghost small" id="pauseSession">'+icon('pause',14)+' Pausar</button>':'<button class="btn small" id="resumeSession">Continuar</button>'}
      <details><summary aria-label="Opciones de la sesión">${icon('more',18)}</summary><div class="session-menu">
        <button class="btn ghost small" id="abandonSession">Abandonar sesión</button>
        <p>${a.kind==='exam'&&a.value.paused?'El reloj está detenido.':'El progreso se guarda en este navegador.'}</p>
      </div></details>
    </div>
  </div>`:'';
  const pausedHere=a?.value.paused&&state.screen===a.screen;
  root.innerHTML=banner+(pausedHere?`<div class="empty">${icon('pause',28)}${header('Un momento de pausa.','La sesión está guardada. Continuá cuando estés listo.')}</div>`:({home,temario,practica:practice,flash:flashcard,errores:errors,examen:exam,dashboard,emergencia:emergency,desarrollo:development,materiales})[state.screen]());
  if(recoveryNotice)root.insertAdjacentHTML('afterbegin',`<div class="feedback bad" role="alert">${esc(recoveryNotice)}</div>`);
  else if(storageFailed)root.insertAdjacentHTML('afterbegin','<div class="feedback bad" role="alert">No se pudo guardar en el navegador. Revisá el espacio disponible y los permisos de almacenamiento; no cierres esta página si necesitás conservar la sesión.</div>');
  bind();
  if(state.screen==='temario')drawNotes();
  if(state.exam&&!state.exam.finished&&!state.exam.paused){updateTime();if(!state.exam.finished)timer=setInterval(updateTime,1000)}
}
function updateTime(){const e=state.exam;if(!e||e.finished||e.paused)return;const left=Math.max(0,Math.ceil((e.end-Date.now())/1000)),c=$('timer');if(c)c.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(!left)finishExam()}
function bind(){document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>go(b.dataset.route));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{state.topic=b.dataset.topic;go('temario')});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.topic=b.dataset.filter;render()});document.querySelectorAll('[data-flashtopic]').forEach(b=>b.onclick=()=>{state.flashTopic=b.dataset.flashtopic;state.flashIndex=0;state.flashBack=false;render()});const find=id=>$(id);if(find('startNow'))find('startNow').onclick=()=>go('practica');if(find('readNow'))find('readNow').onclick=()=>go('temario');if(find('termSearch'))find('termSearch').oninput=e=>{state.search=e.target.value;drawNotes()};if(find('startPractice'))find('startPractice').onclick=()=>beginQuiz();if(find('retryWrong'))find('retryWrong').onclick=()=>{state.screen='practica';beginQuiz('errors',wrongIds())};if(find('again'))find('again').onclick=()=>beginQuiz();document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(!state.quiz||state.quiz.checked||state.quiz.paused)return;state.quiz.chosen=+b.dataset.answer;render()});if(find('leavePractice'))find('leavePractice').onclick=()=>{state.quiz=null;render()};if(find('checkOrNext'))find('checkOrNext').onclick=()=>{let v=state.quiz,x=QUESTIONS.find(q=>q.id===v.ids[v.at]);if(!v.checked){v.checked=true;let good=v.chosen===x.answer;v.right+=Number(good);v.wrong+=Number(!good);record(x,good)}else{v.at++;v.checked=false;v.chosen=null}render()};if(find('flip'))find('flip').onclick=()=>{state.flashBack=!state.flashBack;render()};if(find('flashPrev'))find('flashPrev').onclick=()=>{let len=FLASH.filter(f=>state.flashTopic==='all'||f[0]===state.flashTopic).length;state.flashIndex=(state.flashIndex+len-1)%len;state.flashBack=false;render()};if(find('flashNext'))find('flashNext').onclick=()=>{state.flashIndex++;state.flashBack=false;render()};if(find('startExam'))find('startExam').onclick=startExam;if(find('examFinish'))find('examFinish').onclick=()=>{let missing=state.exam.ids.length-Object.keys(state.exam.answers).length;if(missing&&!confirm(`Te faltan ${missing} preguntas. ¿Finalizar igualmente?`))return;finishExam()};if(find('repeatExam'))find('repeatExam').onclick=()=>{state.exam=null;render()};if(find('examNext'))find('examNext').onclick=()=>{state.exam.at++;render()};if(find('examPrev'))find('examPrev').onclick=()=>{state.exam.at--;render()};document.querySelectorAll('[data-examjump]').forEach(b=>b.onclick=()=>{state.exam.at=+b.dataset.examjump;render()});document.querySelectorAll('[data-examanswer]').forEach(b=>b.onclick=()=>{let ex=state.exam;if(!ex||ex.finished||ex.paused)return;if(Date.now()>=ex.end){finishExam();return}ex.answers[ex.ids[ex.at]]=+b.dataset.examanswer;render()})}

function activeSession(){if(state.exam&&!state.exam.finished)return {kind:'exam',screen:'examen',value:state.exam};if(state.quiz&&state.quiz.at<state.quiz.ids.length)return {kind:'quiz',screen:'practica',value:state.quiz};return null}
function pauseSession(){const a=activeSession();if(a&&!a.value.paused){if(a.kind==='exam'){a.value.remaining=Math.max(0,a.value.end-Date.now());if(!a.value.remaining){finishExam();return}}a.value.paused=true;save()}}
function resumeSession(){const a=activeSession();if(!a)return;if(a.value.paused){if(a.kind==='exam')a.value.end=Date.now()+a.value.remaining;a.value.paused=false}state.screen=a.screen;render()}
function abandonSession(){const a=activeSession();if(a&&confirm('¿Abandonar esta sesión? Se conserva el historial ya registrado, pero se descarta la ronda en curso.')){state[a.kind]=null;render()}}

function unitStats(id){const qs=QUESTIONS.filter(q=>q.topic===id),h=qs.map(q=>state.hist[q.id]).filter(Boolean);const attempts=h.reduce((n,v)=>n+v.seen,0),right=h.reduce((n,v)=>n+v.right,0);return {answered:h.filter(v=>v.seen).length,attempts,right,rate:attempts?right/attempts:null,errors:qs.filter(q=>state.hist[q.id]?.seen&&!state.hist[q.id].lastCorrect).length,mastered:DEVELOPMENT.filter(d=>d.topic===id&&state.development[d.id]?.mastered).length}}
function priority(q){const h=state.hist[q.id],u=unitStats(q.topic);if(!h?.seen)return 1000+(1-(u.rate??0))*50;if(!h.lastCorrect)return 700+(1-(u.rate??0))*50;const age=h.lastAt?(Date.now()-h.lastAt)/86400000:30;return 100+Math.min(age,30)*8+(1-(u.rate??0))*50- Math.min(h.right,10)}
function adaptive(pool,n=pool.length){const groups=TOPICS.map(t=>shuffle(pool.filter(q=>q.topic===t.id)).sort((a,b)=>priority(b)-priority(a)));const out=[];while(out.length<n&&groups.some(g=>g.length)){const round=shuffle(groups.filter(g=>g.length)).sort((a,b)=>priority(b[0])-priority(a[0]));for(const g of round){if(out.length<n)out.push(g.shift().id)}}return out}





const originalPractice=practice,originalQuizView=quizView;
practice=function(){return originalPractice().replace('Podés salir y volver a empezar cuando quieras.','Tu ronda se guarda. Al cambiar de sección se pausa; podés continuar o abandonarla.').replace('Las preguntas salen mezcladas para que practiques sin memorizar el orden.','Se priorizan preguntas nuevas, errores y unidades débiles, con revisiones espaciadas y equilibrio entre unidades.')};
quizView=function(){const q=state.quiz;let html=originalQuizView();if(q.which==='emergency')html='<div class="round-context">Repaso de emergencia · 20 preguntas</div>'+html;if(q.at>=q.ids.length){const weak=TOPICS.map(t=>({t,ids:q.ids.filter(id=>QUESTIONS.find(x=>x.id===id).topic===t.id)})).filter(u=>u.ids.some(id=>q.answers?.[id]===false));html+=`<div class="panel" style="margin-top:15px"><h2>Áreas para reforzar</h2>${weak.length?weak.map(u=>`<p>${esc(u.t.name)}: ${u.ids.filter(id=>q.answers?.[id]===false).length} errores. Repasá el temario y su explicación.</p>`).join(''):'<p>Sin errores en esta ronda. Continuá con revisiones espaciadas.</p>'}</div>`}return html};
function dashboard(){return `${header('Rendimiento académico','Resultados registrados en este navegador; los conceptos dominados son autoevaluados.')}<div class="grid2">${TOPICS.map(t=>{const u=unitStats(t.id);return `<div class="panel"><span class="pill">${esc(t.name)}</span><div class="kv">Preguntas respondidas <b>${u.answered}/${QUESTIONS.filter(q=>q.topic===t.id).length}</b></div><div class="kv">Aciertos (${u.attempts} intentos) <b>${u.rate===null?'Sin datos':Math.round(u.rate*100)+'%'}</b></div><div class="kv">Errores pendientes <b>${u.errors}</b></div><div class="kv">Conceptos dominados <b>${u.mastered}/${DEVELOPMENT.filter(d=>d.topic===t.id).length}</b></div><p class="hint">${u.rate===null?'Empezá por las preguntas sin practicar.':u.errors?'Revisá las explicaciones de tus errores y practicá esta unidad.':u.rate<.7?'Reforzá las definiciones del temario.':'Volvé a revisar esta unidad después de un intervalo.'}</p></div>`}).join('')}</div><div class="sectionline"><h2>Evolución entre simulacros</h2></div><div class="panel">${state.sessions.length?state.sessions.map((s,i)=>`<div class="listrow">${new Date(s.time).toLocaleString('es-PY')} · ${s.score}% · ${s.total} preguntas${s.omitted===undefined?' · Registro anterior sin detalle de omisiones':` · ${s.omitted} omitidas`}${i?` · Variación: ${s.score-state.sessions[i-1].score>0?'+':''}${s.score-state.sessions[i-1].score} puntos porcentuales`:''}${s.units?`<div class="source">${Object.entries(s.units).map(([id,u])=>`${esc(topic(id).name)}: ${u.right}/${u.total}`).join(' · ')}</div>`:''}</div>`).join(''):'Todavía no finalizaste simulacros.'}<p class="notice">Los tamaños y preguntas pueden variar: la diferencia de puntaje no demuestra por sí sola una mejora de aprendizaje.</p></div>`}
function emergency(){return `${header('Repaso de emergencia','Una ronda de 20 preguntas: nuevas, falladas y unidades débiles.')}<div class="panel"><p>Sin repeticiones dentro de la ronda, con representación equilibrada de las cinco unidades. Leé la explicación después de cada respuesta.</p><button class="btn primary" id="startEmergency">${icon('zap')} Iniciar repaso de 20 preguntas</button></div>`}
const DEVELOPMENT=FLASH.map((f,i)=>({id:'d'+i,topic:f[0],title:f[1],model:f[2],concepts:({0:['organización','bienes|servicios','necesidades'],1:['talleres','gremios'],2:['mecanización','fábricas','serie'],3:['globalización','automatización','cliente'],4:['prever','organizar','dirigir','coordinar','controlar'],5:['planeación','organización','ejecución','control'],6:['organismo social'],7:['distinta|diferente','técnicas|contables'],8:['simultáneamente|simultáneas|coexisten'],9:['niveles','cuerpo administrativo'],10:['gradual','economía formal'],11:['registro','licencias','seguridad social','tributario|tributarias','laboral|laborales'],12:['informal','formal'],13:['financiación','mercados','sanciones','empleo'],14:['registra','clasifica','resume','operaciones'],15:['confiable','oportuna','verificable'],16:['decisiones','fiscales|tributarias'],17:['información financiera','operaciones'],18:['integra','departamentos'],19:['internet'],20:['contraseñas','permisos'],21:['supervisar','principios contables']})[i]}));
const normalize=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function conceptMatches(text,concept){const value=' '+normalize(text)+' ';return concept.split('|').some(word=>value.includes(' '+normalize(word)+' '))}
function development(){return `${header('Preguntas de desarrollo','Comparación orientativa por palabras y conceptos. No hay corrección por IA.')}<div class="toolbar" aria-label="Filtrar desarrollo por unidad"><button class="tag ${ui.developmentTopic==='all'?'on':''}" data-devtopic="all">Todas las unidades</button>${TOPICS.map(t=>`<button class="tag ${ui.developmentTopic===t.id?'on':''}" data-devtopic="${t.id}">${esc(t.name)}</button>`).join('')}</div><p class="hint">Escribí sin mirar. Compará luego con el modelo y verificá precisión, relaciones entre conceptos y ausencia de contradicciones. Mencionar palabras no garantiza comprender.</p>${DEVELOPMENT.filter(d=>ui.developmentTopic==='all'||d.topic===ui.developmentTopic).map(d=>{const v=state.development[d.id]||{},matches=d.concepts.filter(c=>conceptMatches(v.text||'',c));return `<div class="note"><span class="pill">${esc(topic(d.topic).name)}</span><h3 style="margin-top:12px">Explicá: ${esc(d.title)}</h3><label for="text-${d.id}" class="source">Tu respuesta</label><textarea id="text-${d.id}" data-draft="${d.id}" rows="4" class="search">${esc(v.text||'')}</textarea><button class="btn small" data-review="${d.id}">Comparar con el modelo</button>${v.reviewed?`<div class="feedback"><b>Respuesta modelo</b><p>${esc(d.model)}</p><p>Conceptos obligatorios:</p><ul>${d.concepts.map(c=>`<li>${conceptMatches(v.text||'',c)?'Detectado':'Revisar'}: ${esc(c.split('|').join(' / '))}</li>`).join('')}</ul><p>${matches.length}/${d.concepts.length} coincidencias orientativas. Revisá sinónimos, negaciones y sentido de tu respuesta.</p><p>¿Explicaste todos los conceptos con tus palabras? ¿Tu respuesta coincide en significado con el modelo? ¿Podrías dar un ejemplo?</p><label><input type="checkbox" data-mastery="${d.id}" ${v.mastered?'checked':''}> Puedo explicar este concepto sin ayuda</label><div class="source">Fuente declarada: ${esc(topic(d.topic).source)}. Referencia de estudio: flashcard «${esc(d.title)}». Documento original no incluido; página sin verificar.</div></div>`:''}</div>`}).join('')}`}
const originalBind=bind;
bind=function(){originalBind();const on=(id,fn)=>{if($(id))$(id).onclick=fn};on('startEmergency',()=>beginQuiz('emergency',QUESTIONS));on('leavePractice',()=>{pauseSession();go('home')});on('again',()=>{const which=state.quiz.which;state.quiz=null;beginQuiz(which,which==='emergency'?QUESTIONS:null)});on('checkOrNext',()=>{const v=state.quiz;if(!v||v.paused||v.at>=v.ids.length)return;const x=QUESTIONS.find(q=>q.id===v.ids[v.at]);if(!v.checked){if(v.chosen===null)return;v.checked=true;const good=v.chosen===x.answer;v.right+=Number(good);v.wrong+=Number(!good);(v.answers||(v.answers={}))[x.id]=good;record(x,good)}else{v.at++;v.checked=false;v.chosen=null}render()});document.querySelectorAll('[data-draft]').forEach(el=>el.oninput=()=>{const v=state.development[el.dataset.draft]||(state.development[el.dataset.draft]={});v.text=el.value;v.mastered=false;v.reviewed=false;const note=el.closest('.note'),feedback=note.querySelector('.feedback');if(feedback)feedback.remove();save()});document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const v=state.development[b.dataset.review]||(state.development[b.dataset.review]={});v.reviewed=true;render();$('text-'+b.dataset.review).focus()});document.querySelectorAll('[data-mastery]').forEach(b=>b.onchange=()=>{state.development[b.dataset.mastery].mastered=b.checked;save()});on('resumeSession',resumeSession);on('pauseSession',()=>{pauseSession();render()});on('abandonSession',abandonSession)};

const SIMPLE_NOTES={empresa:'Pensá en una empresa como personas y recursos organizados para ofrecer algo que otros necesitan. La misión indica su propósito; los objetivos expresan lo que busca lograr.',admin:'Unidad temporal significa que planificar, organizar y controlar pueden coexistir: mientras se ejecuta una actividad, también se revisan sus resultados y se ajusta el plan.',formalizacion:'Formalizar no es solamente registrar un nombre: también supone licencias, seguridad social y cumplimiento tributario y laboral. Por eso el material habla de un proceso gradual.',contabilidad:'Registrar es dejar constancia de las operaciones; clasificar es agruparlas; resumir es convertirlas en información útil para decidir. La calidad de esa información depende de registros rigurosos.',software:'Un ERP conecta información de distintos departamentos. El software reduce tareas repetitivas, pero la revisión del contador sigue siendo necesaria para asegurar la calidad de los registros.'};
const baseDrawNotes=drawNotes;
drawNotes=function(){baseDrawNotes();const area=$('notes');if(!area)return;const entries=TOPICS.filter(t=>(state.topic==='all'||t.id===state.topic)&&(!state.search.trim()||normalize(SIMPLE_NOTES[t.id]+' '+t.name).includes(normalize(state.search))));if(entries.length)area.insertAdjacentHTML('beforeend',`<div class="sectionline"><h2>En palabras simples</h2></div>${entries.map(t=>`<div class="note"><h3>${esc(t.name)}</h3><p>${esc(SIMPLE_NOTES[t.id])}</p><div class="source">Paráfrasis didáctica del resumen disponible. Fuente declarada: ${esc(t.source)}; documento original sin verificar.</div></div>`).join('')}`)};

function setTheme(theme){
  ui.theme=theme;
  if(!document.documentElement)return;
  document.documentElement.setAttribute('data-theme',theme);
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content',theme==='light'?'#f7f6f2':'#18191c');
  const button=$('themeToggle');
  if(button){button.innerHTML=icon(theme==='light'?'moon':'sun',18);button.setAttribute('aria-label',theme==='light'?'Activar modo oscuro':'Activar modo claro');button.title=theme==='light'?'Modo oscuro':'Modo claro'}
}
setTheme(ui.theme);
const studyRender=render;
render=function(){
  // El verificador de lógica usa un DOM mínimo; la presentación requiere DOM real.
  if(!document.body)return studyRender();
  const focused=document.activeElement;
  const filterAttr=['data-filter','data-flashtopic','data-devtopic'].find(attr=>focused?.hasAttribute(attr));
  const filterValue=filterAttr?focused.getAttribute(filterAttr):null;
  const focusId=focused?.id;
  const answerAttr=focused?.hasAttribute('data-answer')?'data-answer':focused?.hasAttribute('data-examanswer')?'data-examanswer':null;
  const answerValue=answerAttr?focused.getAttribute(answerAttr):null;
  const previousQuestion=root.querySelector('.question')?.textContent;
  const session=activeSession();
  const studying=!!(session&&!session.value.paused&&state.screen===session.screen);
  document.body.dataset.screen=state.screen;
  document.body.classList.toggle('study-focus',studying);
  document.body.classList.remove('nav-open');
  studyRender();
  // Un temporizador vencido puede haber finalizado la sesión dentro del render.
  const current=activeSession();
  document.body.classList.toggle('study-focus',!!(current&&!current.value.paused&&state.screen===current.screen));
  $('studyNav')?.setAttribute('aria-expanded','false');
  root.querySelectorAll('[data-answer],[data-examanswer]').forEach(button=>{
    button.setAttribute('aria-pressed',String(button.classList.contains('selected')));
    if(button.classList.contains('correct'))button.setAttribute('aria-label','Respuesta correcta: '+button.textContent.trim());
    if(button.classList.contains('wrong'))button.setAttribute('aria-label','Tu respuesta, incorrecta: '+button.textContent.trim());
  });
  root.querySelectorAll('[data-examjump]').forEach(button=>{
    const index=Number(button.dataset.examjump),answered=state.exam?.answers[state.exam.ids[index]]!==undefined;
    button.dataset.answered=String(answered);
    button.setAttribute('aria-label',`Pregunta ${index+1}, ${answered?'respondida':'sin responder'}`);
    if(state.exam?.at===index)button.setAttribute('aria-current','step');
  });
  root.querySelectorAll('.feedback:not([role="alert"])').forEach(el=>{el.setAttribute('role','status');el.setAttribute('aria-live','polite')});
  const progress=root.querySelector('.columns .progress');
  if(progress&&current){const value=current.value;progress.setAttribute('role','progressbar');progress.setAttribute('aria-label','Posición en la ronda');progress.setAttribute('aria-valuemin','0');progress.setAttribute('aria-valuemax',String(value.ids.length));progress.setAttribute('aria-valuenow',String(value.at+1))}
  if(document.body.classList.contains('study-focus')){
    const side=root.querySelector('.columns>.panel:last-child');
    if(side){
      const detail=document.createElement('details'),summary=document.createElement('summary'),content=document.createElement('div');
      summary.textContent=state.screen==='examen'?'Hoja de respuestas':'Ver datos de esta ronda';
      content.className='detail-body';
      while(side.firstChild)content.appendChild(side.firstChild);
      detail.append(summary,content);detail.open=ui.summaryOpen;
      detail.ontoggle=()=>{ui.summaryOpen=detail.open};side.appendChild(detail);
    }
  }
  const question=root.querySelector('.question');
  if(question){question.setAttribute('tabindex','-1');question.id='currentQuestion'}
  const nextQuestion=question&&previousQuestion&&question.textContent!==previousQuestion;
  if(nextQuestion&&(focusId==='checkOrNext'||focusId==='examNext'||focusId==='examPrev'))question.focus();
  else if(answerAttr)root.querySelector(`[${answerAttr}="${answerValue}"]`)?.focus({preventScroll:true});
  else if(filterAttr)root.querySelector(`[${filterAttr}="${filterValue}"]`)?.focus({preventScroll:true});
  else if(focusId&&focusId!=='termSearch'&&focused?.tagName!=='TEXTAREA')$(focusId)?.focus({preventScroll:true});
  document.querySelectorAll('[data-devtopic]').forEach(button=>button.onclick=()=>{ui.developmentTopic=button.dataset.devtopic;render()});
};

};
if($('studyNav'))$('studyNav').onclick=()=>{
  const open=document.body.classList.toggle('nav-open');
  $('studyNav').setAttribute('aria-expanded',String(open));
  if(open)document.querySelector('.nav.active')?.focus();
};
if(document.body){
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&document.body.classList.contains('nav-open')){document.body.classList.remove('nav-open');$('studyNav').setAttribute('aria-expanded','false');$('studyNav').focus()}
    if(event.key==='Tab'&&document.body.classList.contains('nav-open')){
      const links=Array.from(document.querySelectorAll('.sidebar .nav'));
      const first=links[0],last=links[links.length-1];
      if(event.shiftKey&&(document.activeElement===first||!document.querySelector('.sidebar').contains(document.activeElement))){event.preventDefault();last?.focus()}
      else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}
    }
  });
  document.addEventListener('click',event=>{
    if(document.body.classList.contains('nav-open')&&!event.target.closest('.sidebar')&&!event.target.closest('#studyNav')){document.body.classList.remove('nav-open');$('studyNav').setAttribute('aria-expanded','false')}
  });
}

  2:{summary:'La empresa organiza recursos humanos, técnicos y financieros para producir bienes o servicios y alcanzar objetivos. El material también destaca su estructura y dirección.',prompts:['Relacioná recursos, estructura y objetivos en un ejemplo de empresa.']},
  3:{summary:'El aula vincula la formalización con credibilidad, acceso a clientes, financiación y crecimiento. Los efectos fiscales y la separación de patrimonios dependen de la forma jurídica y de las normas aplicables; no son beneficios automáticos de cualquier registro.',prompts:['Explicá cómo la formalización puede facilitar el acceso a mercados y financiación.']},
  4:{summary:'La introducción de esta clase se centra en contabilidad gerencial o directiva: usa información financiera, presupuestos y costos para apoyar decisiones y controlar actividades del negocio.',prompts:['¿Cómo usarías un presupuesto y la información de costos para decidir?','Consigna de la Tarea 1: explicá empresa, sociedad de consumo y competencia. La definición de sociedad de consumo no está desarrollada en los resúmenes actuales; contrastala con el material o con el docente.'],task:{title:'Tarea 1 · consigna original revisada',paragraphs:'Tres párrafos, en no más de una carilla: qué aprendí, cómo impacta en mí lo aprendido y a qué me mueve.',process:['Importancia de la contabilidad.','Origen de la empresa.','Conceptos de empresa, sociedad de consumo y competencia.','Rol del profesional en la gestión empresarial.','Beneficios de la contabilidad como herramienta de gestión.'],format:'Arial 11, interlineado 1,5 y alineación a la izquierda. Total: 5 puntos.',criteria:['Formato','Puntualidad','Comprensión de contenidos','Selección de ideas pertinentes','Vocabulario técnico'],url:'https://ad.unibe.edu.py/pluginfile.php/250138/mod_assign/introattachment/0/Tarea%201.docx?forcedownload=1'}},
  5:{summary:'El material de lectura y el video corresponden a administración y su importancia. Para las definiciones, consultá también el temario ya disponible.',warning:'La introducción de Moodle describe registro y presentación de información económica bajo el título Administración. Parece una confusión con contabilidad; no se incorporó como definición de administración.',prompts:['Diferenciá la función administrativa de la función contable usando las definiciones del temario.']},
  6:{summary:'El aula señala repaso de clases desarrolladas. No contiene lecturas ni videos adicionales en esta sección.',prompts:['Repasá las unidades de empresa, formalización, contabilidad y administración.']},
  7:{summary:'La clase presenta usos de la tecnología en registros financieros, estados financieros, nómina, detección de inconsistencias y seguimiento de préstamos. También relaciona la evolución contable con el comercio, la agricultura y la industria. La automatización ayuda a reducir errores, pero requiere supervisión profesional.',prompts:['Explicá qué tareas facilita la tecnología y cuáles siguen necesitando criterio profesional.','Describí cómo podrías detectar una inconsistencia entre registros usando información del sistema.'],task:{title:'Tarea 2 · consigna original revisada',paragraphs:'Dos párrafos, en no más de una carilla. La consigna pide abordar qué aprendí, cómo impacta en mí lo aprendido y a qué me mueve.',process:['Qué facilita la tecnología en contabilidad.','Beneficios para las empresas.','Importancia de la contabilidad en los negocios.','Rol del profesional con recursos tecnológicos.','Explicar con palabras propias lo aprendido en clase.'],format:'Arial 11, interlineado 1,5 y alineación a la izquierda. Total: 5 puntos.',criteria:['Formato','Puntualidad','Selección de ideas pertinentes','Vocabulario técnico','Normativas gramaticales'],url:'https://ad.unibe.edu.py/pluginfile.php/303203/mod_assign/introattachment/0/Tarea%20N%C2%B0%202%20.docx?forcedownload=1'}},
  8:{summary:'La clase propone observar información contable en las opciones de un sistema y demostraciones de procesos por departamentos. Incluye cuatro videos: configuración de empresa, plan de cuentas, facturas virtuales de Marangatu y una aplicación bancaria.',prompts:['Al ver configuración de empresa: identificá los datos que se solicitan y explicá para qué sirven.','Al ver plan de cuentas: anotá su organización y ejemplos que aparezcan en el video.','Al ver Marangatu: registrá la secuencia demostrada y los datos que exige. Verificá la vigencia del procedimiento antes de usarlo fuera del estudio.','Al ver la aplicación bancaria: distinguí las operaciones mostradas de las funciones de un sistema contable.'],warning:'Estas consignas orientan la observación. No son transcripciones ni procedimientos verificados de los videos.'},
  9:{summary:'Trabajo académico de investigación: el software contable en la gestión empresarial. Moodle solicita redacción clara y precisa, investigación documental o de campo y bibliografía. Puede elaborarse en grupo, pero cada estudiante debe subir su trabajo.',prompts:['Organizá el trabajo siguiendo la guía y el formato enlazados.','Identificá las fuentes de cada afirmación y prepará la bibliografía.']},
  10:{summary:'El software contable simplifica tareas y organiza información útil para la empresa. El documento de esta clase es la referencia ya declarada en la unidad Software contable de la web.',prompts:['Relacioná funciones, ventajas, límites y criterios para elegir un software contable.']},
  11:{summary:'La sección indica repaso de clases desarrolladas y parcial ordinario. No publica un temario detallado del examen ni materiales adicionales.',prompts:['Usá el repaso adaptativo para detectar debilidades; el catálogo no confirma qué preguntas entrarán en el parcial.']}
};
const materialFilters={classNumber:'all',type:'all',search:''};
function matchingMaterials(){
  const query=normalize(materialFilters.search);
  return COURSE_MATERIALS.filter(c=>materialFilters.classNumber==='all'||String(c.number)===materialFilters.classNumber).map(c=>{
    const guide=CLASS_GUIDES[c.number];
    const classMatch=normalize(c.title+' '+guide.summary+' '+guide.prompts.join(' ')).includes(query);
    const resources=c.resources.filter(r=>(materialFilters.type==='all'||r.type===materialFilters.type)&&(!query||classMatch||normalize(r.title+' '+r.status).includes(query)));
    return {...c,resources};
  }).filter(c=>c.resources.length||(materialFilters.type==='all'&&(!query||normalize(c.title+' '+CLASS_GUIDES[c.number].summary+' '+CLASS_GUIDES[c.number].prompts.join(' ')).includes(query))));
}
function materialLink(url,label){return `<a class="btn small ghost" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)} ${icon('arrow',14)}</a>`}
function materialsList(){
  const classes=matchingMaterials();
  if(!classes.length)return '<div class="empty" role="status">No hay materiales para estos filtros. Probá otra clase, tipo de recurso o búsqueda.</div>';
  return classes.map(c=>{
    const guide=CLASS_GUIDES[c.number];
    const task=guide.task;
    return `<section class="note material-class"><div class="eyebrow">${c.number?'Clase '+c.number:'Aula virtual'} · ${c.resources.length} recursos</div><h2>${esc(c.title)}</h2><p>${esc(guide.summary)}</p>${guide.warning?`<p class="hint" style="margin-top:12px">${esc(guide.warning)}</p>`:''}<p class="source">Síntesis de la sección visible del aula, consultada el 1 de noviembre de 2026.</p>${materialLink(c.source,'Ver sección en Moodle')}<details ${materialFilters.classNumber!=='all'||materialFilters.search||materialFilters.type!=='all'?'open':''}><summary style="cursor:pointer;padding:14px 0;font-weight:650">Materiales y guía de estudio</summary><div>${c.resources.map(r=>`<div class="listrow"><div class="source">${esc(r.type)}</div><h3>${esc(r.title)}</h3><p class="source">${esc(r.status)}${r.type==='Video'?' El título identifica el recurso del curso; no implica revisión de su contenido.':' Los recursos de Moodle pueden requerir iniciar sesión.'}</p>${materialLink(r.url,r.type==='Video'?'Ver video en YouTube':'Abrir recurso')}</div>`).join('')||'<p class="muted">Esta clase no publica recursos adicionales.</p>'}${guide.prompts.length?`<h3 style="margin-top:20px">Para estudiar</h3><ul>${guide.prompts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><p class="source">Guía de repaso elaborada a partir del contexto de la clase; no es una consigna de examen.</p>`:''}${task?`<div class="hint" style="margin-top:18px"><h3>${esc(task.title)}</h3><p>${esc(task.paragraphs)}</p><ul>${task.process.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><p>${esc(task.format)}</p><p>Indicadores: ${esc(task.criteria.join(' · '))}.</p>${materialLink(task.url,'Leer consigna DOCX')}</div>`:''}</div></details></section>`;
  }).join('');
}
function materiales(){
  const count=COURSE_MATERIALS.reduce((n,c)=>n+c.resources.length,0);
  return `${header('Materiales del curso','Lecturas, videos y actividades organizados por clase.')}<p class="hint">${count} referencias del aula · 11 videos · 11 clases y recursos generales. Los apuntes de esta página funcionan sin conexión; los enlaces abren Moodle o YouTube y necesitan internet. No se cargan reproductores automáticamente.</p><p class="source">Inventario consultado el 1 de noviembre de 2026. Incluir un enlace no significa haber revisado todo su contenido. No se incluyen datos personales ni entregas del estudiante.</p><div class="toolbar"><label style="flex:1;min-width:200px">Clase <select id="materialClass" class="select" style="width:100%;min-width:0"><option value="all">Todas las clases</option>${COURSE_MATERIALS.map(c=>`<option value="${c.number}" ${materialFilters.classNumber===String(c.number)?'selected':''}>${c.number?'Clase '+c.number:'General'} · ${esc(c.title)}</option>`).join('')}</select></label><label style="flex:1;min-width:180px">Tipo <select id="materialType" class="select" style="width:100%;min-width:0">${['all','Video','Documento','Enlace','Actividad','Foro'].map(t=>`<option value="${t}" ${materialFilters.type===t?'selected':''}>${t==='all'?'Todos los recursos':t}</option>`).join('')}</select></label></div><label for="materialSearch" class="source">Buscar en los materiales</label><input class="search" id="materialSearch" type="search" placeholder="Plan de cuentas, presupuesto, tarea…" value="${esc(materialFilters.search)}"><div id="materialsList" style="margin-top:24px">${materialsList()}</div>`;
}
const bindBeforeMaterials=bind;
bind=function(){
  bindBeforeMaterials();
  const redraw=()=>{$('materialsList').innerHTML=materialsList()};
  if($('materialSearch'))$('materialSearch').oninput=e=>{materialFilters.search=e.target.value;redraw()};
  if($('materialClass'))$('materialClass').onchange=e=>{materialFilters.classNumber=e.target.value;redraw()};
  if($('materialType'))$('materialType').onchange=e=>{materialFilters.type=e.target.value;redraw()};
};

render();
</script></body></html>
